<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<title>Lead Panel</title>
<style>
/* ============================================================
   LEAD PANEL v6.5 — GUARDADO EN DOS PASOS + DETALLE REBALANCEADO
   (motor v24.4; solo panel, sin Nueva version del webhook).
   v6.5 (feedback de Rodrigo sobre v6.4):
   1. GUARDADO EN DOS PASOS (desktop y movil): la tarjeta Update
      status queda SOLO con los 6 botones. Al tocar Save se abre una
      hoja de confirmacion (mismo componente del modal de seguros)
      con los campos del status elegido — premium/comision/termino
      para Sold, quoted premium para Quoted, razon para Declined —
      la nota opcional y el boton Confirm & save. Los campos
      requeridos ya no pueden pasar desapercibidos: estan en foco.
      El contrato con api=save es IDENTICO (mismos params, misma
      validacion); guardarRapido del prompt post-llamada no cambia.
   2. Comision sin sesgo: se elimina el hint "usually 6-9%" y el
      placeholder "e.g. 7" — solo "Agent commission (%) optional".
   3. Layout desktop rebalanceado: IZQUIERDA (400px) = Insurance
      intel (DOT) + UNA tarjeta "Lead details" seccionada (Coverage
      answers > Business profile con NAICS/SIC primero > Financials
      > Contact), sin scroll interno (contenido oculto = trampa).
      DERECHA = Notes de Rodrigo > Your activity > Update status.
   4. Financials: montos normalizados a $X,XXX (revenue, payroll,
      subcontractors); FT employees queda como conteo.
   5. Hero: pill de status junto al ID (ya no flota a la derecha);
      Call y WhatsApp con el MISMO ancho fijo.
   6. CURRENT como badge real anclado al borde del boton.
   ------------------------------------------------------------
   LEAD PANEL v6.4 — DETALLE PENSADO COMO FLUJO DE AGENTE (motor
   v24.4; solo panel, sin Nueva version del webhook).
   v6.4: jerarquia de informacion de venta, no volcado de datos:
   - DESKTOP: sidebar IZQUIERDA (340px) = datos de referencia que la
     agente consulta durante la llamada — Full details partido en
     tarjetas semanticas (Contact / Business profile / Financials /
     Coverage answers, mapeo por etiqueta con grupo "Other details"
     para lo no reconocido: ninguna fila se pierde) + Your activity.
     Columna DERECHA = el flujo de trabajo: Notes de Rodrigo ->
     Insurance intel -> Update status. Patron CRM clasico (panel
     "about" a la izquierda, trabajo al centro).
   - Valores Yes/No como pills verde/gris (escaneables de un vistazo)
     y el email como link mailto. Data intacta, solo presentacion.
   - MOVIL: mismo flujo de Jenny de siempre; Full details sigue
     siendo UNA tarjeta colapsable, ahora con subtitulos de grupo
     adentro (se revierte el "open" forzado de v6.3).
   - Update status: pulido visual puro (hover, foco de inputs,
     seleccion mas clara) — cero cambios de logica, ids o flujo.
   ------------------------------------------------------------
   LEAD PANEL v6.3.1 — DETALLE ESTILO DOTSEARCH EN DESKTOP (motor
   v24.4; solo panel, sin Nueva version del webhook).
   v6.3.1 corrige el desastre de v6.3 (columna fija que quedaba
   VACIA en modo admin porque Update status no existe, y reorden del
   DOM movil). Nueva estructura, decidida por viewport EN EL RENDER:
   - DESKTOP (>=900px): hero como TARJETA redondeada contenida (como
     el banner de dotsearch) con la info del lead a la izquierda y
     Call/WhatsApp a la derecha; debajo, grilla principal (1fr) +
     lateral (320px). Las tarjetas se REPARTEN segun existan:
     principal = notas + insurance + update status; lateral = full
     details (abierto) + activity. Si la principal queda vacia (modo
     admin sin notas), la lateral pasa a ser la columna unica
     centrada — jamas una columna fantasma.
   - MOVIL: EXACTAMENTE el flujo original de Jenny — orden del DOM
     notas > insurance > activity > details > status, botones
     solapados al hero, cero cambios (se revierte el reorden v6.3).
   - Tarjetas con el lenguaje del modal (titulos uppercase con
     divisor) y modal: autoridad vacia = linea explicativa (v6.3).
   ------------------------------------------------------------
   LEAD PANEL v6.2 — FASE 2: CARRIER PROFILE (requiere motor v24.4).
   v6.2: el modal de Insurance se reestructura estilo dotsearch,
   manteniendo paleta y tipografia del panel:
   - Hero oscuro con el nombre legal del carrier (QCMobile), badges
     DOT / MC y stat boxes grandes de POWER UNITS y DRIVERS.
   - Dos tabs: Insurance (todo el contenido v6.1, intacto en logica)
     y Carrier (Operation + Authority, Safety con barras OOS driver/
     vehicle contra promedio nacional, Safety Rating honesto,
     Crashes 24m, Mileage/MCS-150 del Census).
   - Tolerancia total a faltantes: sin carrier.prof (JSON pre-v24.4
     o cache en transicion) el tab dice "profile not loaded yet";
     sin m150, "MCS-150 data not available"; carrier.exists false =>
     el tab Carrier ni aparece; safetyRating null => "Not Available".
   - Barras OOS: verde bajo el promedio nacional, rojo encima, con
     marcador del promedio y conteo "X of Y inspections OOS".
   - Cero emojis; retrocompatible con JSONs v24.0-v24.3.
   ------------------------------------------------------------
   LEAD PANEL v6.1 — INSURANCE INTEL (requiere motor v24.3).
   v6.1: chip de lista minimo (texto fijo "FMCSA filing", el color
   cuenta la historia); banda roja "DOT not found" cuando QCMobile
   dice que el numero no existe (mal dictado); el no_filing muestra
   el nombre del carrier segun FMCSA cuando se conoce.
   ------------------------------------------------------------
   LEAD PANEL v6.0 — INSURANCE INTEL (requiere motor v24).
   v6.0: inteligencia de seguros FMCSA, condicional al DOT:
   - Lista: leads con DOT llevan UNA linea discreta (dot de color +
     aseguradora). Rojo = cancelacion pendiente; ambar = sin seguro
     activo / sin filing / renovacion <= 90 dias; verde suave = OK;
     gris = data pendiente. Leads sin DOT: tarjeta identica, cero
     cambios de layout.
   - Detalle: fila "Insurance" bajo las notas; al tocarla se abre el
     Insurance Intel — bottom sheet en movil, modal centrado en
     desktop (>=900px). Secciones: estado actual (aseguradora, tipo
     humano, efectiva, renovacion proyectada por aniversario, banda
     de cancelacion pendiente), filings activos adicionales,
     historial (deduplicado; sin duracion si las fechas del feed
     vienen incoherentes), metricas derivadas y pie con updated_at +
     link a SAFER. Historial limitado a los ultimos 20 filings.
   - Con DOT sin data: la fila dice "Insurance - tap to load" y el
     tap dispara api=insurance (reintento con throttle en el motor).
   - Formularios BMC en lenguaje humano: 91/91X Liability (BI&PD),
     34 Cargo, 84 Surety Bond, 85 Trust Fund; otros = "Form XX"
     (nunca se inventa un mapeo no confirmado).
   - Cero emojis en toda la feature; indicadores por CSS.
   ------------------------------------------------------------
   LEAD PANEL v5.5 — HUMANO ESTRICTO EN SAVE Y CALL (auditoría).
   v5.5: api=save y api=call exigen humano === true, sin fallback de
   tiempo. Los "clicks" sintéticos de los sandboxes (el.click()) NO
   disparan pointerdown/touchstart; el dedo de Jenny sí — su primer
   tap marca humano antes de que cualquier handler de click corra
   (listeners en capture). Un escáner jamás puede guardar un status
   ni registrar una llamada. Costo para Jenny: cero.
   ------------------------------------------------------------
   LEAD PANEL v5.4 — PRUEBA DE HUMANO + CONTADORES EXTENDIDOS
   (requiere motor v23.3).
   v5.4:
   1. ANTI-ESCÁNER: cargar el detalle ya NO registra la apertura.
      Al primer gesto real (touch / scroll / tecla / mouse) con la
      página visible, se dispara api=opened UNA vez. Los sandboxes
      de los escáneres de correo renderizan pero no interactúan →
      se acabaron las aperturas fantasma. api=call además exige
      humano previo o 2.5s de página cargada (los auto-clickers de
      los escáneres actúan al instante).
   2. CONTADOR EN TODOS LOS ESTADOS VIVOS: New (desde envío),
      Opened (desde apertura), Called/Contacted/Not Reached/
      Follow-Up/Quoted (desde la última acción de Jenny). Bound /
      Sold, Declined y Dead / Lost NO llevan contador.
   3. Vista All: Bound / Sold, Declined y Dead / Lost ya no aparecen
      en "Everything Else" — solo con los chips Sold / Closed (la
      búsqueda sí los encuentra por nombre).
   ------------------------------------------------------------
   LEAD PANEL v5.3 — ORDEN POR ÚLTIMA ACCIÓN EN LAS SECCIONES.
   v5.3: dentro de cada sección de acción, los leads se ordenan por
   el MISMO timestamp del contador, lo más reciente arriba:
   New = envío · Opened = apertura · Called = última acción de
   Jenny (updated_ts). El timer queda ascendente dentro del grupo
   (arriba lo recién tocado, abajo lo más frío). "Everything Else"
   conserva el orden por fecha de envío. Solo cambia el panel.
   ------------------------------------------------------------
   LEAD PANEL v5.2 — CONTADORES VIVOS + MARCADOR DE VERSIÓN.
   v5.2 (requiere motor v23.2: opened_ts/updated_ts en api=list):
   - Contador de tiempo pequeño en la tarjeta, bajo el ID y la hora:
     New / Transferred = desde el envío · Opened = desde la apertura
     · Called = desde que pasó a Called (LAST_UPDATED). Cualquier
     otro estado NO lleva contador. Formato 32m / 3h 12m / 2d 4h;
     gris <1h, ámbar 1-24h, rojo 24h+. Se refresca con el poll de
     60s y con un tick local cada 60s.
   - Encabezados de la vista All: "New / Transferred — Open Now" →
     "Opened — Needs Action" → "Called — Pending Status" →
     "Everything Else".
   - "v5.2" visible al pie de la lista para VERIFICAR el deploy
     (si no se ve, GitHub Pages sirve el archivo viejo).
   ------------------------------------------------------------
   LEAD PANEL v5.1 — SECCIÓN "Called — pending update".
   v5.1: en la vista All, la lista se agrupa New leads → Opened —
   needs action → Called — pending update → Everything else. Chip
   de filtro "Called" nuevo. Nada más cambia sobre v5.
   ------------------------------------------------------------
   LEAD PANEL v5 — CALL TRACKING (requiere motor v23).
   v5: cada tap en Call dispara api=call (fire-and-forget: si la red
   falla, la llamada de Jenny NO se bloquea — el conteo se pierde,
   nunca la llamada). El motor cuenta la llamada (columna CALLS),
   escribe TIME TO CALL la primera vez, avanza el status a "Called"
   SOLO desde New / Transferred u Opened y avisa a Rodrigo por
   Telegram en cada llamada. El modo ADMIN no registra llamadas.
   El encabezado del detalle muestra el conteo ("· 3 calls") y el
   pill gana el color de "Called". El prompt post-llamada ("How did
   the call go?") sigue igual: es la vía natural para salir de
   "Called" hacia Contacted / Not Reached.
   ------------------------------------------------------------
   LEAD PANEL v4.4 — RENDIMIENTO (requiere motor v21.5).
   v4.4: percepción de instantaneidad, sin cambios de flujo:
   - La lista se pinta AL INSTANTE desde la última copia conocida
     (localStorage 'jl_lista_v1') y se refresca en segundo plano.
     La copia se borra al cerrar sesión o al vencer la sesión.
   - Al tocar un lead, el encabezado (nombre, negocio, estado,
     Call/WhatsApp) se pinta de inmediato con los datos de la lista;
     el detalle completo llega detrás. Los links de correo (?id&t sin
     lista) conservan el spinner de siempre.
   - Modo admin: se elimina el ping previo — el motor v21.5 responde
     admin_expired sin registrar apertura si la sesión venció.
   - La lista también se auto-refresca en modo ADMIN (paridad con el
     panel de Hector v1.1).
   - preconnect a script.google.com / script.googleusercontent.com.
   ------------------------------------------------------------
   LEAD PANEL v4.3.1 — comisión del agente en % + término de la póliza.
   v4.3.1: SOLO cambia la var API (motor v21 standalone: nueva URL
   /exec). Cero cambios funcionales para Jenny.
   v4.3: en el formulario Sold, Agent commission ahora es PORCENTAJE
   (6-9% típico, validado 0-100) y se agrega el término de la póliza
   (6 o 12 meses, obligatorio, default 12). El backend v20 calcula
   renewal (Sold At + término) y expected pay (Sold At + 1 mes).
   v4.2 (historial): lista + buscador + filtros + detalle.
   v4.2: en la vista All, sección "Opened — needs action" entre
   "New leads" y "Everything else" (leads que Jenny abrió y dejó sin
   registrar estado recuperan visibilidad).
   v4.1: MODO ADMIN para Rodrigo — entrar con ?admin=1 (código de 6
   dígitos a SU correo, sesión 30 días en localStorage 'jl_admin').
   En modo admin: abrir un lead NO registra apertura ni cambia el
   estado (fetch con &adm=), y el detalle es SOLO LECTURA (sin
   botones de estado ni prompt post-llamada). Badge ADMIN visible.
   Autenticación de Jenny igual que v4; los links por-lead (?id&t)
   siguen entrando directo al detalle sin sesión.
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#17233b;--paper:#f2f4f7;--line:#e7eaf0;--sub:#5a6b85;--wa:#1fab55}
html{background:#e9edf2}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#e9edf2;margin:0;padding:0;color:#101828}
#app{max-width:520px;margin:0 auto;padding:0 0 96px;background:var(--paper);min-height:100vh}
@media (min-width:700px){
  #app{margin:28px auto 40px;border-radius:18px;overflow:hidden;box-shadow:0 8px 40px rgba(16,24,40,.14);min-height:calc(100vh - 68px)}
}

/* ── Header oscuro ── */
.hero{background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 54px}
.hero.flat{padding-bottom:48px}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;color:#8fa3c4;text-transform:uppercase}
.pill{color:#fff;font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;white-space:nowrap}
.hero h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.hero .biz{margin:6px 0 0;font-size:14.5px;color:#c3cede}
.hero .chips{margin-top:12px}
.chip{display:inline-block;background:rgba(255,255,255,.12);color:#e7edf7;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;margin:0 6px 6px 0;border:1px solid rgba(255,255,255,.14)}
.backlink{display:inline-flex;align-items:center;gap:6px;color:#c3cede;font-size:13.5px;font-weight:700;text-decoration:none;background:none;border:0;cursor:pointer;padding:0;margin:0 0 10px}

/* ── Acciones primarias (encimadas al header del detalle) ── */
.acts{display:flex;gap:10px;margin:-32px 16px 14px}
.act{flex:1;display:block;text-align:center;padding:15px;border-radius:14px;text-decoration:none;font-weight:800;font-size:15.5px;box-shadow:0 4px 14px rgba(23,35,59,.18)}
.act.call{background:#fff;color:var(--ink)}
.act.wa{background:var(--wa);color:#fff}

.wrap{padding:0 16px;background:var(--paper)}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line)}
.label{font-size:11px;font-weight:700;letter-spacing:1.4px;color:#98a2b3;margin:0 0 8px;text-transform:uppercase}
/* v6.3: titulos de tarjeta del DETALLE con divisor (lenguaje del modal) */
.card>.label{padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.card.warn>.label{border-bottom-color:#f3e3bd}
.notes ul{margin:0;padding-left:18px}
.notes li{font-size:14.5px;color:#344054;margin-bottom:5px;line-height:1.45}
.card.warn{background:#fffaeb;border-color:#fedf89}
.card.warn .label{color:#b54708}
.card.warn li{color:#7a3b06;font-weight:600}
.card.act-prev{background:#f8fafc}
.drow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px solid #f2f4f7}
.drow:last-child{border-bottom:0}
.drow span{color:var(--sub)}
.drow b{text-align:right}
/* v6.4: subtitulos de grupo dentro de Full details (movil) */
.gsub{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#b3bcc9;text-transform:uppercase;margin:13px 0 2px}
.inner .gsub:first-child{margin-top:4px}
/* v6.4: pills Yes/No y link de email */
.pv{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px}
.pv.yes{background:#e6f4ee;color:#12805c}
.pv.no{background:#eef0f4;color:#667085}
.dlink{color:#17233b;font-weight:700;text-decoration:none;border-bottom:1px solid #d0d5dd}
/* v6.5: tarjeta unica Lead details, filas compactas */
.card.dets .drow{padding:6px 0;font-size:13.5px}
.card.dets .drow b{word-break:break-word}
.card.dets .gsub{margin:14px 0 3px}
.card.dets .gsub:first-of-type{margin-top:2px}
/* v6.5: hoja de confirmacion de guardado */
.sheet .sbody .cbtn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:13px;border:0;background:var(--ink);color:#fff;font-size:15.5px;font-weight:800;cursor:pointer}
.sheet .sbody .cbtn:disabled{background:#c6cdd8}
.sheet .sbody label{display:block;font-size:13px;font-weight:700;color:#344054;margin:12px 0 6px}
.drow b{text-align:right;color:#101828}
details.card{padding:0;overflow:hidden}
details.card summary{list-style:none;cursor:pointer;padding:15px 18px 12px;font-size:11px;font-weight:700;letter-spacing:1.4px;color:#98a2b3;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin:0 0 2px}
details.card:not([open]) summary{border-bottom:0}
details.card summary::after{content:'+';font-size:16px;color:#98a2b3;font-weight:600;letter-spacing:0}
details[open].card summary::after{content:'–'}
details.card .inner{padding:4px 18px 14px}

/* ── Grilla de estados 2×3 ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.st{position:relative;display:flex;align-items:center;gap:9px;padding:14px 12px;border:1.5px solid var(--line);border-radius:13px;background:#fff;color:#101828;font-size:14.5px;font-weight:700;cursor:pointer;text-align:left;transition:border-color .12s,background .12s}
.st:hover{border-color:#b9c2d0}
.st .dot{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.st.sel{border-color:var(--c);background:color-mix(in srgb, var(--c) 9%, #fff);box-shadow:0 0 0 1px var(--c)}
@supports not (background:color-mix(in srgb,#fff 9%,#fff)){.st.sel{background:#f8fafc}}
.curtag{position:absolute;top:-8px;right:10px;background:#17233b;color:#fff;font-size:9px;font-weight:800;letter-spacing:.8px;padding:3px 9px;border-radius:999px}
.ctx{display:none;background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:11px}
label{display:block;font-size:13px;font-weight:600;color:#344054;margin:9px 0 5px}
label:first-child{margin-top:0}
.req{color:#d92d20;font-weight:600;font-size:11px}
.opt{color:#98a2b3;font-weight:500;font-size:11px}
.hint{margin:4px 0 0;font-size:12px;color:var(--sub)}
input,select,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:11px;font-size:16px;background:#fff;color:#101828}
input:focus,select:focus,textarea:focus{outline:none;border-color:#17233b;box-shadow:0 0 0 3px rgba(23,35,59,.08)}
textarea{height:62px;resize:vertical}
.errline{color:#d92d20;font-size:14px;font-weight:600;min-height:18px;margin:9px 2px 0}

/* ── Barra de guardado fija ── */
.savebar{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(242,244,247,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.save{display:block;width:100%;padding:16px;border:0;border-radius:13px;font-size:16px;font-weight:800;color:#fff;background:var(--ink);cursor:pointer}
.save:disabled{background:#c6cdd8;cursor:default}

/* ── Éxito / errores ── */
.center{text-align:center;padding:60px 24px;background:var(--paper)}
.okmark{width:66px;height:66px;line-height:66px;border-radius:50%;background:#12805c;color:#fff;font-size:34px;font-weight:700;margin:0 auto 14px}
.center h2{margin:0 0 6px;font-size:22px}
.center .muted{color:var(--sub);font-size:14.5px;margin:6px 0 0}
.btn-back{display:inline-block;margin:22px 5px 0;padding:14px 26px;border-radius:13px;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;border:0;font-size:15px;cursor:pointer}
.btn-back.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:80px auto;animation:g .8s linear infinite}

/* ── Prompt post-llamada ── */
.callprompt{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:12px;right:12px;margin:0 auto;max-width:496px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(16,24,40,.18);z-index:20}
.callprompt p{margin:0 0 10px;font-size:15px;font-weight:800;color:#101828}
.callprompt .cp-row{display:flex;gap:9px}
.cp-btn{flex:1;padding:13px;border-radius:12px;border:0;font-size:14.5px;font-weight:800;cursor:pointer}
.cp-yes{background:#12805c;color:#fff}
.cp-no{background:#eef0f4;color:#101828}
.cp-later{display:block;width:100%;margin-top:8px;background:none;border:0;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;padding:6px}

/* ── LISTA ── */
.searchwrap{margin:-26px 16px 12px;position:relative}
.searchwrap input{padding:15px 16px;border-radius:14px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(23,35,59,.14);font-size:16px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fl{flex:none;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:#344054;font-size:13.5px;font-weight:700;cursor:pointer}
.fl.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fl .n{opacity:.65;font-weight:600;margin-left:4px}

.icard .label{margin-bottom:10px}
.iband{border-radius:12px;padding:11px 13px;font-size:13.5px;font-weight:700;margin-bottom:11px;line-height:1.4}
.iband.red{background:#fef3f2;border:1px solid #fecdca;color:#b42318}
.iband.amber{background:#fffaeb;border:1px solid #fedf89;color:#b54708}
.iins{font-size:17px;font-weight:800;color:#101828;line-height:1.25;margin:0 0 2px}

/* v6.2: titulos de seccion del modal con divisor (estructura dotsearch) */
.icard .label{padding-bottom:8px;border-bottom:1px solid var(--line)}
/* v6.2: hero del modal */
.shero{flex:none;background:linear-gradient(135deg,#17233b 0%,#233553 100%);color:#fff;padding:16px 18px 14px;border-radius:20px 20px 0 0;position:relative}

.shs{background:#fff;border-radius:13px;padding:10px 8px;text-align:center}

/* v6.2: tabs */

.oosb{padding:10px 0;border-bottom:1px solid #f2f4f7}

.oosb .ot{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:#101828}

.ocap .above{color:#b42318;font-weight:700}
/* v6.2: crash boxes */
.cstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cs{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.cs b{display:block;font-size:17px;color:#101828}
.cs span{display:block;font-size:9.5px;color:#98a2b3;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-top:3px}
@media (min-width:900px){
  .sheet{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-46%) scale(.98);opacity:0;max-width:640px;max-height:82vh;border-radius:20px}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet .shead{border-radius:20px 20px 0 0}
  .imetrics{gap:11px}
}

/* ── OTP ── */
.otpwrap{padding:0 20px 30px;background:var(--paper)}

.otpcard h2{margin:0 0 6px;font-size:19px}
.otpcard p{margin:0 0 16px;font-size:14px;color:var(--sub);line-height:1.5}

.btn-full{display:block;width:100%;margin-top:14px;padding:15px;border-radius:13px;border:0;background:var(--ink);color:#fff;font-size:15.5px;font-weight:800;cursor:pointer}
.btn-full:disabled{background:#c6cdd8}
.btn-ghost{display:block;width:100%;margin-top:10px;padding:12px;border-radius:13px;border:0;background:none;color:var(--sub);font-size:13.5px;font-weight:700;cursor:pointer}
/* ── Desktop (≥900px): lista a dos columnas, detalle en columna centrada ── */
@media (min-width:900px){
  #app{max-width:940px}
  .hero{padding-left:36px;padding-right:36px}

  .searchwrap{margin-left:36px;margin-right:36px}
  .filters{padding-left:36px;padding-right:36px}
  .wrap{padding-left:36px;padding-right:36px}
  #rows{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
  #rows .groupttl{grid-column:1/-1;margin-bottom:2px}
  #rows .lead{margin-bottom:0;min-width:0}
  #rows .empty{grid-column:1/-1}
  .otpwrap{max-width:620px;margin:0 auto}
  /* v6.3.1: DETALLE en desktop, estructura dotsearch. El JS arma un
     DOM distinto por viewport: aqui solo se estilan .det-hero (hero
     tarjeta con acciones a la derecha) y .dmain/.dside (grilla). */
  #app{max-width:1040px}
  .hero.det-hero{margin:20px 36px 0;border-radius:18px;padding:26px 30px 26px}
  .hero.det-hero .row{justify-content:flex-start;gap:12px}
  .hero.det-hero .hinner{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
  .hero.det-hero .hmain{min-width:0}
  .hacts{display:flex;gap:10px;flex:none;margin-bottom:2px}
  .hacts .act{flex:none;width:180px;padding:14px 0;text-align:center}
  /* v6.5: sidebar de referencia a la IZQUIERDA (mas ancha), flujo a la derecha */
  .wrap.det{margin-top:16px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:0 16px;align-items:start}
  .wrap.det.solo{display:block;max-width:720px;margin-left:auto;margin-right:auto}
  .dmain,.dside{min-width:0}
  .dside .card, .dside details.card{margin-bottom:12px}
  .savebar{max-width:940px}
  .savebar .save{max-width:620px;margin:0 auto}
}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

<body>
<div id="app"><div class="spin"></div></div>

<script>
// ====== CONFIGURA ESTO: tu URL /exec del Apps Script ======
var API = 'https://script.google.com/macros/s/AKfycbw3vDEX509WAsvwrT6exgib4z4tFknocNAr82uxvDrR2u9NYRMyLM7aOqJWrNERCqSZ/exec';
// ===========================================================

var app = document.getElementById('app');
var COLORES = {'New / Transferred':'#667085','Opened':'#0e7490','Called':'#7c3aed','Contacted':'#12805c',
  'Not Reached':'#667085','Follow-Up':'#dc6803','Quoted':'#1d4ed8','Bound / Sold':'#14532d',
  'Declined':'#d92d20','Dead / Lost':'#344054'};
var ETIQ = {'New / Transferred':'New','Bound / Sold':'Sold','Dead / Lost':'Lost'};
var OPCIONES = [
  ['contacted','Contacted','#12805c','Contacted'],
  ['not_reached','Not Reached','#667085','Not Reached'],
  ['followup','Follow-Up','#dc6803','Follow-Up'],
  ['quoted','Quoted','#1d4ed8','Quoted'],
  ['sold','Sold','#14532d','Bound / Sold'],
  ['declined','Declined','#d92d20','Declined']
];
// Filtros de la lista: [id, etiqueta, estados que agrupa (null = todos)]
var FILTROS = [
  ['all','All', null],
  ['new','New', ['New / Transferred']],
  ['opened','Opened', ['Opened']],
  ['called','Called', ['Called']],
  ['working','In progress', ['Contacted','Not Reached','Follow-Up']],
  ['quoted','Quoted', ['Quoted']],
  ['sold','Sold', ['Bound / Sold']],
  ['closed','Closed', ['Declined','Dead / Lost']]
];

var SES = null, ADM = null;
try { SES = localStorage.getItem('jl_session') || null; } catch (e) {}
try { ADM = localStorage.getItem('jl_admin') || null; } catch (e) {}
var LISTA = [];            // cache de api=list
var filtroActivo = 'all';
var textoBusqueda = '';
var vistaActual = '';      // 'lista' | 'detalle' | 'otp'
var LEAD = null, ID = null, T = null;
var sel = null, selLabel = '';
var pollTimer = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pillEstado(st, extra){
  return '<span class="' + (extra || 'pill') + '" style="background:' + (COLORES[st] || '#667085') + '">' +
    esc(ETIQ[st] || st) + '</span>';
}
function guardarSesion(s){ SES = s; try { localStorage.setItem('jl_session', s); } catch (e) {} }
function borrarSesion(){ SES = null; try { localStorage.removeItem('jl_session'); localStorage.removeItem('jl_lista_v1'); } catch (e) {} }
function guardarAdmin(s){ ADM = s; try { localStorage.setItem('jl_admin', s); } catch (e) {} }
function borrarAdmin(){ ADM = null; try { localStorage.removeItem('jl_admin'); localStorage.removeItem('jl_lista_v1'); } catch (e) {} }
function salirAdmin(){ borrarAdmin(); history.pushState({}, '', location.pathname); arrancar(); }

// ============================================================
//  ARRANQUE Y NAVEGACIÓN
//  ?id&t → detalle directo (links de correo, con o sin sesión).
//  ?admin=1 → login de ADMIN (código al correo de Rodrigo).
//  Sin parámetros → lista (pide código si no hay sesión).
// ============================================================
function arrancar(){
  var qs = new URLSearchParams(location.search);
  ID = qs.get('id'); T = qs.get('t');
  if (qs.get('admin') && !ADM) { verOtp(true); return; }
  if (ID && T) { verDetalle(ID, T, false); }
  else if (SES || ADM) { verLista(); }
  else { verOtp(false); }
}
window.addEventListener('popstate', arrancar);

function irADetalle(id, t){
  history.pushState({}, '', location.pathname + '?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t));
  verDetalle(id, t, true);
}
function volverALista(){
  cerrarSeguro();
  history.pushState({}, '', location.pathname);
  verLista();
}
// A la lista (con sesión) o a la pantalla de código (sin sesión).
function irALeads(){
  history.pushState({}, '', location.pathname);
  if (SES || ADM) verLista(); else verOtp(false);
}

// ============================================================
//  VISTA: CÓDIGO DE ACCESO
// ============================================================
// v4.1: esAdmin=true → código al correo de Rodrigo, sesión jl_admin.
function verOtp(esAdmin){
  vistaActual = 'otp';
  var who = esAdmin ? '&who=admin' : '';
  app.innerHTML =
    '<div class="hero flat"><span class="eyebrow">Lead Panel' + (esAdmin ? ' · ADMIN' : '') + '</span>' +
    '<h1>' + (esAdmin ? 'Admin access' : 'Welcome, Jenny') + '</h1>' +
    '<p class="biz">' + (esAdmin ? 'Read-only mode. Opening leads will not affect anything.' : 'Your leads, in one place.') + '</p></div>' +
    '<div class="otpwrap"><div class="otpcard">' +
      '<h2>Verify it\'s you</h2>' +
      '<p>Tap the button and we\'ll email a 6-digit code to ' + (esAdmin ? 'Rodrigo\'s inbox' : 'your inbox') + '. You\'ll only need to do this once on this device.</p>' +
      '<button class="btn-full" id="btn-send">Email me a code</button>' +
      '<div id="otp-step2" style="display:none">' +
        '<label style="margin-top:18px">Access code</label>' +
        '<input id="otp-code" class="otpcode" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="one-time-code">' +
        '<button class="btn-full" id="btn-verify">Enter</button>' +
        '<button class="btn-ghost" id="btn-resend">Send a new code</button>' +
      '</div>' +
      '<p id="otp-err" class="errline"></p>' +
    '</div></div>';

  var err = document.getElementById('otp-err');
  function pedirCodigo(btn){
    btn.disabled = true; btn.textContent = 'Sending...'; err.textContent = '';
    fetch(API + '?api=otp_request' + who).then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) { err.textContent = d.error || 'Could not send the code.'; btn.disabled = false; btn.textContent = 'Email me a code'; return; }
        document.getElementById('btn-send').style.display = 'none';
        document.getElementById('otp-step2').style.display = 'block';
        document.getElementById('otp-code').focus();
        btn.disabled = false;
      })
      .catch(function(){ err.textContent = 'Connection error. Try again.'; btn.disabled = false; btn.textContent = 'Email me a code'; });
  }
  document.getElementById('btn-send').onclick = function(){ pedirCodigo(this); };
  document.getElementById('btn-resend').onclick = function(){
    var b = this; b.disabled = true; b.textContent = 'Sending...';
    fetch(API + '?api=otp_request' + who).then(function(r){ return r.json(); })
      .then(function(d){
        err.textContent = d.ok ? '' : (d.error || 'Could not send the code.');
        b.disabled = false; b.textContent = 'Send a new code';
        if (d.ok) document.getElementById('otp-code').focus();
      })
      .catch(function(){ err.textContent = 'Connection error.'; b.disabled = false; b.textContent = 'Send a new code'; });
  };
  document.getElementById('btn-verify').onclick = function(){
    var code = document.getElementById('otp-code').value.trim();
    if (code.length !== 6) { err.textContent = 'Enter the 6-digit code from your email.'; return; }
    var b = this; b.disabled = true; b.textContent = 'Checking...'; err.textContent = '';
    fetch(API + '?api=otp_verify&code=' + encodeURIComponent(code) + who)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) { err.textContent = d.error || 'Incorrect code.'; b.disabled = false; b.textContent = 'Enter'; return; }
        if (esAdmin) guardarAdmin(d.session); else guardarSesion(d.session);
        history.pushState({}, '', location.pathname);
        verLista();
      })
      .catch(function(){ err.textContent = 'Connection error. Try again.'; b.disabled = false; b.textContent = 'Enter'; });
  };
}

// ============================================================
//  VISTA: LISTA DE LEADS (buscador + filtros + refresco 60s)
// ============================================================
function verLista(){
  vistaActual = 'lista';
  // v4.4: pintar AL INSTANTE desde la última lista conocida y traer la
  // versión fresca en segundo plano (el repintado es imperceptible).
  if (!LISTA.length) {
    try { LISTA = JSON.parse(localStorage.getItem('jl_lista_v1') || '[]'); } catch (e) { LISTA = []; }
    if (!(LISTA instanceof Array)) LISTA = [];
  }
  if (LISTA.length) { pintarLista(true); cargarLista(false); }
  else { app.innerHTML = '<div class="spin"></div>'; cargarLista(true); }
}

function cargarLista(render){
  if (!SES && !ADM) { verOtp(false); return; }
  var auth = ADM ? '&adm=' + encodeURIComponent(ADM) : '&s=' + encodeURIComponent(SES);
  fetch(API + '?api=list' + auth)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.ok) {
        if (ADM) { borrarAdmin(); verOtp(true); } else { borrarSesion(); verOtp(false); }
        return;
      }
      LISTA = d.leads || [];
      try { localStorage.setItem('jl_lista_v1', JSON.stringify(LISTA)); } catch (e) {}
      if (vistaActual === 'lista') pintarLista(render);
    })
    .catch(function(){
      if (render && vistaActual === 'lista') {
        app.innerHTML = '<div class="center"><h2>Connection error</h2>' +
          '<p class="muted">Check your signal.</p>' +
          '<button class="btn-back" onclick="verLista()">Retry</button></div>';
      }
    });
}

function filtrar(){
  var f = null;
  for (var i = 0; i < FILTROS.length; i++) if (FILTROS[i][0] === filtroActivo) f = FILTROS[i];
  var q = textoBusqueda.trim().toLowerCase();
  var qDig = q.replace(/\D/g, '');
  return LISTA.filter(function(l){
    if (f && f[2] && f[2].indexOf(l.status) === -1) return false;
    if (!q) return true;
    var blob = (l.id + ' ' + l.name + ' ' + l.business + ' ' + l.type + ' ' +
      l.state + ' ' + l.status + ' ' + (l.coverages || []).join(' ')).toLowerCase();
    if (blob.indexOf(q) !== -1) return true;
    if (qDig.length >= 3 && l.phone10 && l.phone10.indexOf(qDig) !== -1) return true;
    return false;
  });
}

// v5.4: contador vivo en TODOS los estados hasta cerrar: New (desde
// el envío), Opened (desde la apertura), Called / Contacted / Not
// Reached / Follow-Up / Quoted (desde la última acción de Jenny =
// updated_ts). Bound / Sold, Declined y Dead / Lost: sin contador.
var SIN_CONTADOR = {'Bound / Sold':1, 'Declined':1, 'Dead / Lost':1};
function tsContador(l){
  if (SIN_CONTADOR[l.status]) return 0;
  if (l.status === 'New / Transferred') return l.sent_ts || 0;
  if (l.status === 'Opened') return l.opened_ts || l.sent_ts || 0;
  return l.updated_ts || l.opened_ts || l.sent_ts || 0;
}
function htmlContador(l){
  var ts = tsContador(l);
  if (!ts) return '';
  var min = Math.max(0, Math.floor((Date.now() - ts) / 60000));
  var txt, cls;
  if (min < 60) txt = min + 'm';
  else if (min < 1440) txt = Math.floor(min / 60) + 'h ' + (min % 60) + 'm';
  else txt = Math.floor(min / 1440) + 'd ' + Math.floor((min % 1440) / 60) + 'h';
  cls = min < 60 ? 'lt-ok' : (min < 1440 ? 'lt-warn' : 'lt-late');
  return '<span class="ltimer ' + cls + '">\u23F1 ' + txt + '</span>';
}

function filaLead(l){
  var esNuevo = l.status === 'New / Transferred';
  var cov = (l.coverages || []).join(', ');
  return '<button type="button" class="lead" data-id="' + esc(l.id) + '" data-t="' + esc(l.t) + '">' +
    (esNuevo ? '<span class="newdot"></span>' : '') +
    '<span class="lmain">' +
      '<span class="lname" style="display:block">' + esc(l.name || '-') + '</span>' +
      '<span class="lsub" style="display:block">' + esc(l.business || '') + (l.type ? ' · ' + esc(l.type) : '') + '</span>' +
      (cov ? '<span class="lcov" style="display:block">' + esc(cov) + '</span>' : '') +
      chipSeguroLista(l) +
    '</span>' +
    '<span class="lright">' + pillEstado(l.status, 'lpill') +
      '<span class="ldate" style="display:block">' + esc(l.id) +
        (l.sent ? ' · ' + esc(l.sent) : '') + '</span>' +
      htmlContador(l) +
    '</span></button>';
}

// v4.2: cuerpo de la lista compartido por pintarLista y repintarFilas.
// v5.1: en la vista All sin búsqueda: New leads → Opened (needs
// action) → Called (pending update) → Everything else.
function construirCuerpo(){
  var visibles = filtrar();
  if (!visibles.length) {
    return '<p class="empty">' + (textoBusqueda ? 'No leads match your search.' : 'No leads here yet.') + '</p>';
  }
  if (filtroActivo === 'all' && !textoBusqueda) {
    // v5.4: en All no aparecen los cerrados — viven en los chips
    // Sold / Closed (la búsqueda por nombre sí los encuentra).
    visibles = visibles.filter(function(l){ return !SIN_CONTADOR[l.status]; });
    if (!visibles.length) {
      return '<p class="empty">No open leads. Use the Sold / Closed filters to see finished leads.</p>';
    }
    // v5.3: cada grupo ordenado por su timestamp de acción (tsContador),
    // lo más reciente arriba — el timer sube de arriba hacia abajo.
    var porAccion = function(a, b){ return tsContador(b) - tsContador(a); };
    var nuevos = visibles.filter(function(l){ return l.status === 'New / Transferred'; }).sort(porAccion);
    var abiertos = visibles.filter(function(l){ return l.status === 'Opened'; }).sort(porAccion);
    var llamados = visibles.filter(function(l){ return l.status === 'Called'; }).sort(porAccion);
    if (nuevos.length || abiertos.length || llamados.length) {
      var resto = visibles.filter(function(l){
        return l.status !== 'New / Transferred' && l.status !== 'Opened' && l.status !== 'Called'; });
      return (nuevos.length ? '<p class="groupttl">New / Transferred — Open Now <span class="badge">' + nuevos.length + '</span></p>' +
                nuevos.map(filaLead).join('') : '') +
             (abiertos.length ? '<p class="groupttl">Opened — Needs Action <span class="badge">' + abiertos.length + '</span></p>' +
                abiertos.map(filaLead).join('') : '') +
             (llamados.length ? '<p class="groupttl">Called — Pending Status <span class="badge">' + llamados.length + '</span></p>' +
                llamados.map(filaLead).join('') : '') +
             (resto.length ? '<p class="groupttl">Everything Else</p>' + resto.map(filaLead).join('') : '');
    }
  }
  return visibles.map(filaLead).join('');
}

function pintarLista(scrollTop){
  vistaActual = 'lista';

  var chips = FILTROS.map(function(f){
    var n = f[2] ? LISTA.filter(function(l){ return f[2].indexOf(l.status) !== -1; }).length : LISTA.length;

// ============================================================
//  INSURANCE INTEL (v6) — condicional al DOT. Data del motor v24:
//  api=list trae l.dot + l.ins (chip {n,s,e}); api=lead trae
//  d.dot + d.insurance (objeto completo); api=insurance reintenta
//  la carga cuando la celda sigue pendiente (throttle en el motor).
// ============================================================
var FORM_HUMANO = {'91':'Liability (BI&PD)','91X':'Liability (BI&PD)','34':'Cargo','84':'Surety Bond','85':'Trust Fund'};
function tipoHumano(code){
  var c = String(code || '').toUpperCase();
  return FORM_HUMANO[c] || (c ? 'Form ' + c : '');
}
function metodoHumano(m){
  var s = String(m || '').toUpperCase();
  if (s.indexOf('REPL') !== -1) return ['Replaced','rep'];
  if (s.indexOf('CANC') !== -1 || s === 'CANCEL') return ['Cancelled','can'];
  return [m || '', 'rep'];
}
function fFecha(mdY){ // 'MM/DD/YYYY' -> 'Mar 1, 2019' (o el crudo si no parsea)
  var m = String(mdY || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return String(mdY || '');
  var MES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return MES[parseInt(m[1],10)-1] + ' ' + parseInt(m[2],10) + ', ' + m[3];
}
function tsDe(mdY){
  var m = String(mdY || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? new Date(parseInt(m[3],10), parseInt(m[1],10)-1, parseInt(m[2],10)).getTime() : 0;
}
// Renovación proyectada: próximo aniversario de la fecha efectiva.
function renovacion(effTs){
  if (!effTs) return null;
  var eff = new Date(effTs), hoy = new Date();
  var r = new Date(hoy.getFullYear(), eff.getMonth(), eff.getDate());
  if (r.getTime() <= hoy.getTime()) r = new Date(hoy.getFullYear()+1, eff.getMonth(), eff.getDate());
  var dias = Math.ceil((r.getTime() - hoy.getTime()) / 864e5);
  var MES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return {fecha: MES[r.getMonth()] + ' ' + r.getDate() + ', ' + r.getFullYear(), dias: dias};
}
// Estado visual del chip: parte del c.s del motor y aplica la regla
// cliente de renovación <= 90 días (ambar) sobre los 'ok'.
function estadoChip(ins){
  if (!ins) return null;
  var s = ins.s, ren = null;
  if (s === 'ok' && ins.e) {
    ren = renovacion(ins.e);
    if (ren && ren.dias <= 90) s = 'amber';
  }
  return {s: s, n: ins.n || '', ren: ren};
}
function claseDot(s){
  return s === 'red' ? 'id-red' : (s === 'amber' ? 'id-amber' : (s === 'ok' ? 'id-ok' : 'id-gray'));
}
// Chip de la LISTA: una sola línea discreta. Sin DOT: cadena vacía
// (cero cambios de layout).
function chipSeguroLista(l){
  if (!l.dot) return '';
  // v6.1: superficie minima — texto fijo, el color cuenta la historia
  // y el detalle vive en el sheet. La tarjeta no crece de ancho ni
  // carga nombres largos de aseguradoras.
  var e = estadoChip(l.ins);
  return '<span class="inschip"><span class="idot ' + claseDot(e ? e.s : 'gray') +
    '"></span><span class="itxt">FMCSA filing</span></span>';
}

// ── Sheet / modal ──
var seguroAbierto = null;
function cerrarSeguro(){
  if (!seguroAbierto) return;
  var el = seguroAbierto; seguroAbierto = null;
  el.ov.classList.remove('on'); el.sh.classList.remove('on');
  setTimeout(function(){ if (el.ov.parentNode) el.ov.parentNode.removeChild(el.ov);
    if (el.sh.parentNode) el.sh.parentNode.removeChild(el.sh); }, 240);
}
// v6.2: el sheet se arma completo (hero + tabs + cuerpo) segun la
// data disponible. Con carrier verificado: hero oscuro con nombre
// legal, badges DOT/MC, stat boxes y tabs Insurance | Carrier. Sin
// carrier (JSON viejo, red caida o DOT inexistente): encabezado
// simple v6.1 y solo el cuerpo de Insurance — cero dead-ends.
function armarSeguroSheet(sh, dot, ins){
  var carrier = ins && ins.carrier;
  var conHero = !!(carrier && carrier.exists && carrier.name);
  var conTabCarrier = !!(carrier && carrier.exists !== false);
  var H = '';
  if (conHero) {
    var prof = carrier.prof || null;
    var m150 = carrier.m150 || null;
    var lugar = [carrier.city, carrier.state].filter(Boolean).join(', ');
    var dotOk = prof && prof.allowed === 'Y';
    H += '<div class="shero">' +
      '<button type="button" class="sclose" aria-label="Close">&#10005;</button>' +
      '<div class="shname">' + esc(carrier.name) + '</div>' +
      (lugar ? '<div class="shloc">' + esc(lugar) + '</div>' : '') +
      '<div class="shpills">' +
        '<span class="pchip ' + (prof ? (dotOk ? 'ok' : 'red') : 'slate') + '">DOT ' + esc(dot) + '</span>' +
        (m150 && m150.mc ? '<span class="pchip slate">' + esc(m150.mc) + '</span>' : '') +
        (prof && prof.op ? '<span class="pchip slate">' + esc(prof.op) + '</span>' : '') +
      '</div>' +
      (prof ? '<div class="shstats">' +
        '<div class="shs"><b>' + (prof.pu === null ? '-' : prof.pu) + '</b><span>Power Units</span></div>' +
        '<div class="shs"><b>' + (prof.drv === null ? '-' : prof.drv) + '</b><span>Drivers</span></div>' +
      '</div>' : '') +
    '</div>';
  } else {
    H += '<div class="shead"><div><div class="sttl">Insurance</div>' +
      '<div class="ssub">DOT ' + esc(dot) + '</div></div>' +
      '<button type="button" class="sclose" aria-label="Close">&#10005;</button></div>';
  }
  if (ins && conTabCarrier) {
    H += '<div class="stabs">' +
      '<button type="button" class="stab on" data-tab="ins">Insurance</button>' +
      '<button type="button" class="stab" data-tab="car">Carrier</button></div>';
  }
  H += '<div class="sbody">' + (ins ? cuerpoSeguro(ins) : '<div class="spin" style="margin:40px auto"></div>') + '</div>';
  sh.innerHTML = H;
  sh.querySelector('.sclose').addEventListener('click', cerrarSeguro);
  var tabs = sh.querySelectorAll('.stab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function(){
      var yo = this;
      for (var k = 0; k < tabs.length; k++) tabs[k].classList.remove('on');
      yo.classList.add('on');
      var body = sh.querySelector('.sbody');
      body.innerHTML = (yo.getAttribute('data-tab') === 'car') ? cuerpoCarrier(ins) : cuerpoSeguro(ins);
      body.scrollTop = 0;
    });
  }
}
function abrirSeguro(dot, ins){
  cerrarSeguro();
  var ov = document.createElement('div'); ov.className = 'ov';
  var sh = document.createElement('div'); sh.className = 'sheet';
  armarSeguroSheet(sh, dot, ins);
  document.body.appendChild(ov); document.body.appendChild(sh);
  ov.addEventListener('click', cerrarSeguro);
  seguroAbierto = {ov: ov, sh: sh, dot: dot};
  requestAnimationFrame(function(){ ov.classList.add('on'); sh.classList.add('on'); });
  if (!ins) cargarSeguro(sh);
}
// Reintento on-demand (chip gris): api=insurance con throttle del motor.
function cargarSeguro(sh){
  fetch(API + '?api=insurance&id=' + encodeURIComponent(ID) + '&t=' + encodeURIComponent(T) +
      (ADM ? '&adm=' + encodeURIComponent(ADM) : ''))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!seguroAbierto || seguroAbierto.sh !== sh) return;
      var body = sh.querySelector('.sbody');
      if (d.ok && d.insurance) {
        if (LEAD && LEAD.id === ID) LEAD.insurance = d.insurance;
        armarSeguroSheet(sh, seguroAbierto.dot, d.insurance); // v6.2: hero + tabs
      } else {
        body.innerHTML = '<p class="empty">Insurance data is not available yet.<br>' +
          'It refreshes automatically \u2014 try again in a few minutes.</p>';
      }
    })
    .catch(function(){
      if (!seguroAbierto || seguroAbierto.sh !== sh) return;
      sh.querySelector('.sbody').innerHTML = '<p class="empty">Connection error. Try again.</p>';
    });
}
// Historial: dedup exacto + sin duración cuando el feed federal trae
// fechas incoherentes (cancelled < effective — ocurre en carriers
// grandes con cadenas de reemplazo).
function historialLimpio(hist){
  var visto = {}, out = [];
  (hist || []).forEach(function(h){
    var k = [h.insurer, h.type, h.effective, h.cancelled, h.method].join('|');
    if (visto[k]) return; visto[k] = 1; out.push(h);
  });
  return out;
}
function cuerpoSeguro(ins){
  var H = '';
  var act = ins.active;
  var e = estadoChip(ins.c ? ins.c : null);

  // 1) Estado actual
  if (act) {
    var ren = renovacion(tsDe(act.effective));
    H += '<div class="icard"><p class="label">Current coverage</p>';
    if (act.pending_cancel) {
      H += '<div class="iband red">Pending cancellation \u2014 effective ' + esc(fFecha(act.cancel_effective)) +
        '. Coverage lapses on that date unless replaced.</div>';
    } else if (ren && ren.dias <= 90) {
      H += '<div class="iband amber">Projected renewal in ' + ren.dias + ' days.</div>';
    }
    H += '<p class="iins">' + esc(act.insurer || '-') + '</p>' +
      '<p class="itype">' + esc(tipoHumano(act.form)) + (act.policy_no ? ' \u00b7 Policy ' + esc(act.policy_no) : '') + '</p>' +
      '<div class="drow"><span>Effective since</span><b>' + esc(fFecha(act.effective)) + '</b></div>' +
      (ren ? '<div class="drow"><span>Projected renewal</span><b>' + esc(ren.fecha) + ' (' + ren.dias + 'd)</b></div>' : '') +
      '</div>';
    var extras = (ins.active_all || []).slice(1);
    if (extras.length) {
      H += '<div class="icard"><p class="label">Other active filings</p>' +
        extras.map(function(a){
          return '<div class="drow"><span>' + esc(tipoHumano(a.form)) + '</span><b>' + esc(a.insurer) + '</b></div>';
        }).join('') + '</div>';
    }
  } else if (ins.carrier && ins.carrier.exists === false) {
    // v6.1: el DOT no existe en FMCSA — casi siempre un numero mal
    // dictado. Mensaje accionable, no una falsa "sin seguro".
    H += '<div class="icard"><p class="label">Current coverage</p>' +
      '<div class="iband red">DOT not found in FMCSA records.</div>' +
      '<p class="itype" style="margin:0">The number may have been taken down wrong \u2014 ' +
      'confirm it with the client and update the lead notes.</p></div>';
  } else if (ins.no_filing) {
    H += '<div class="icard"><p class="label">Current coverage</p>' +
      '<div class="iband amber">No FMCSA filing on record for this DOT.</div>' +
      '<p class="itype" style="margin:0">' +
      (ins.carrier && ins.carrier.exists && ins.carrier.name
        ? 'FMCSA lists this DOT as ' + esc(ins.carrier.name) +
          (ins.carrier.city ? ' (' + esc(ins.carrier.city) + (ins.carrier.state ? ', ' + esc(ins.carrier.state) : '') + ')' : '') +
          ' with no federal insurance filings. '
        : '') +
      'Intrastate carriers and new authorities may not have federal ' +
      'insurance filings \u2014 this is a federal-record status, not proof the business is uninsured.</p></div>';
  } else {
    H += '<div class="icard"><p class="label">Current coverage</p>' +
      '<div class="iband amber">No active insurance on file. All previous policies were cancelled or replaced.</div></div>';
  }

  // 2) Métricas derivadas
  var hist = historialLimpio(ins.history);
  var aseguradoras = {};
  hist.forEach(function(h){ if (h.insurer) aseguradoras[h.insurer] = 1; });
  if (act && act.insurer) aseguradoras[act.insurer] = 1;
  var nIns = Object.keys(aseguradoras).length;
  var tenencia = '-';
  if (act) {
    var ts = tsDe(act.effective);
    if (ts) {
      var meses = Math.max(0, Math.floor((Date.now() - ts) / (30.44 * 864e5)));
      tenencia = meses >= 12 ? (Math.floor(meses / 12) + 'y ' + (meses % 12) + 'm') : (meses + 'm');
    }
  }
  H += '<div class="imetrics">' +
    '<div class="im"><b>' + esc(tenencia) + '</b><span>With insurer</span></div>' +
    '<div class="im"><b>' + nIns + '</b><span>Insurers on record</span></div>' +
    '<div class="im"><b>' + hist.length + '</b><span>Past filings</span></div>' +
    '</div>';

  // 3) Historial
  if (hist.length) {
    H += '<div class="icard"><p class="label">Policy history</p>' +
      hist.map(function(h){
        var mm = metodoHumano(h.method);
        var e1 = tsDe(h.effective), e2 = tsDe(h.cancelled);
        var periodo = fFecha(h.effective) + ' \u2013 ' + fFecha(h.cancelled);
        var dur = '';
        if (e1 && e2 && e2 >= e1) {
          var dd = Math.round((e2 - e1) / 864e5);
          dur = dd >= 365 ? ' \u00b7 ' + (dd / 365).toFixed(1).replace('.0','') + 'y'
              : dd >= 30 ? ' \u00b7 ' + Math.round(dd / 30) + 'mo' : ' \u00b7 ' + dd + 'd';
        }
        return '<div class="ih"><div class="ihi">' + esc(h.insurer || '-') +
          '<span class="iht ' + mm[1] + '">' + esc(mm[0]) + '</span></div>' +
          '<div class="ihd">' + esc(tipoHumano(h.type)) + ' \u00b7 ' + esc(periodo) + esc(dur) + '</div></div>';
      }).join('') + '</div>';
  }

  // 4) Pie
  H += '<p class="ifoot">FMCSA L&amp;I data \u00b7 Updated ' + esc(ins.updated_at || '') +
    (hist.length >= 20 ? ' \u00b7 Last 20 filings shown' : '') + '<br>' +
    '<a href="https://safer.fmcsa.dot.gov/query.asp?searchtype=ANY&query_type=queryCarrierSnapshot&query_param=USDOT&query_string=' +
    encodeURIComponent(ins.dot || '') + '" target="_blank" rel="noopener">View SAFER snapshot</a></p>';
  return H;
}
// ── v6.2: TAB CARRIER (perfil QCMobile + Census) ──
function fmtPct(n){
  if (n === null || n === undefined) return '-';
  return (Math.round(n * 10) / 10) + '%';
}
function fmtMillas(s){
  var n = Number(s);
  return isNaN(n) ? String(s || '-') : n.toLocaleString('en-US');
}
function fechaIso(iso){ // 'YYYY-MM-DD' -> 'May 20, 2026'
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return String(iso || '-');
  var MES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return MES[parseInt(m[2],10)-1] + ' ' + parseInt(m[3],10) + ', ' + m[1];
}
function authHumano(v){
  if (v === 'A') return ['Active', 'ok'];
  if (v === 'I') return ['Inactive', ''];
  if (v === 'N') return ['None', ''];
  return ['-', ''];
}
// Barra OOS contra el promedio nacional. Verde bajo el promedio,
// rojo encima; marcador gris = promedio nacional. Sin inspecciones:
// badge N/A y texto honesto (no se inventa un 0% "bueno").
function barraOos(titulo, o){
  if (!o) return '';
  if (!o.i) {
    return '<div class="oosb"><div class="ot"><span>' + esc(titulo) +
      '</span><span class="obadge na">N/A</span></div>' +
      '<p class="ocap" style="margin:6px 0 0">No inspections in the last 24 months.</p></div>';
  }
  var r = o.r === null ? 0 : o.r;
  var encima = (o.na !== null && o.r !== null && o.r > o.na);
  var cl = encima ? 'bad' : 'ok';
  var marca = (o.na !== null) ? '<span class="omark" style="left:' + Math.min(o.na, 100) + '%"></span>' : '';
  return '<div class="oosb">' +
    '<div class="ot"><span>' + esc(titulo) + '</span>' +
      '<span class="obadge ' + cl + '">' + esc(fmtPct(o.r)) + '</span></div>' +
    '<div class="otrack"><span class="ofill ' + cl + '" style="width:' + Math.min(r, 100) + '%"></span>' + marca + '</div>' +
    '<p class="ocap" style="margin:0">' + o.o + ' of ' + o.i + ' inspections OOS' +
      (o.na !== null ? ' \u00b7 National Avg: ' + esc(fmtPct(o.na)) : '') +
      (o.na !== null && o.r !== null
        ? ' \u00b7 <span class="' + (encima ? 'above' : 'below') + '">' + (encima ? 'above average' : 'below average') + '</span>'
        : '') + '</p></div>';
}
function cuerpoCarrier(ins){

  // 2) Operation & Authority

    '<div class="drow" style="border-bottom:0"><span>Authority</span></div>' +
    // v6.3: sin autoridad for-hire registrada (tipico intrastate):

    ((aCom[0] === '-' && aCon[0] === '-' && aBrk[0] === '-')
      ? '<p class="ocap" style="margin:2px 0 0">No for-hire operating authority on record \u2014 common for intrastate carriers.</p>'
      : '<div class="achips">' +
          '<span class="achip ' + aCom[1] + '">Common: ' + aCom[0] + '</span>' +
          '<span class="achip ' + aCon[1] + '">Contract: ' + aCon[0] + '</span>' +
          '<span class="achip ' + aBrk[1] + '">Broker: ' + aBrk[0] + '</span>' +

  // 3) Safety: barras OOS + rating
  H += '<div class="icard"><p class="label">Out of service rates \u00b7 last 24 months</p>' +

    ((p.oos && p.oos.h && p.oos.h.i) ? barraOos('Hazmat OOS', p.oos.h) : '') +

  H += '<div class="icard"><p class="label">Safety rating</p>' +
    '<div class="drow" style="border-bottom:0"><span>FMCSA safety rating</span><b>' +
    (p.rate ? esc(p.rate) + (p.rate_date ? ' \u00b7 ' + esc(p.rate_date) : '') : 'Not Available') + '</b></div>' +
    (p.rate ? '' : '<p class="ocap" style="margin:4px 0 0">Most carriers are unrated \u2014 FMCSA only rates after a compliance review.</p>') +
    '</div>';

  // 4) Crashes (ventana SMS de 24 meses)
  var c = p.crash || {};
  var cv = function(x){ return (x === null || x === undefined) ? '-' : x; };
  H += '<div class="icard"><p class="label">Crashes \u00b7 last 24 months</p>' +
    '<div class="cstats">' +
      '<div class="cs"><b>' + cv(c.t) + '</b><span>Total</span></div>' +
      '<div class="cs"><b>' + cv(c.f) + '</b><span>Fatal</span></div>' +
      '<div class="cs"><b>' + cv(c.i) + '</b><span>Injury</span></div>' +
      '<div class="cs"><b>' + cv(c.tw) + '</b><span>Tow-away</span></div>' +
    '</div></div>';

  // 5) Mileage / MCS-150 (Census; honesto si falta)
  H += '<div class="icard"><p class="label">Mileage info</p>' +
    (m
      ? '<div class="drow"><span>Annual mileage</span><b>' +
          (m.mi ? esc(fmtMillas(m.mi)) + ' mi' : '-') + '</b></div>' +
        '<div class="drow"><span>Reported year</span><b>' + esc(m.yr || '-') + '</b></div>' +
        '<div class="drow" style="border-bottom:0"><span>MCS-150 update</span><b>' +
          (m.date ? esc(fechaIso(m.date)) : '-') + '</b></div>'
      : '<p class="ocap" style="margin:0">MCS-150 data not available from the FMCSA Census file.</p>') +
    '</div>';

  H += '<p class="ifoot">FMCSA QCMobile + Census data \u00b7 Updated ' + esc(ins.updated_at || '') + '<br>' +
    '<a href="https://safer.fmcsa.dot.gov/query.asp?searchtype=ANY&query_type=queryCarrierSnapshot&query_param=USDOT&query_string=' +
    encodeURIComponent(ins.dot || '') + '" target="_blank" rel="noopener">View SAFER snapshot</a></p>';
  return H;
}

// ── v6.4: FULL DETAILS AGRUPADO ──
// Mapa etiqueta (lowercase) -> grupo. Lo no reconocido cae en
// "Other details": NINGUNA fila del motor se pierde jamas.
// v6.5: orden de VENTA — calificacion primero, contacto al final
// (llamar/escribir ya vive en los botones del hero). Dentro de cada
// grupo las filas se ordenan segun esta lista (NAICS/SIC arriba de
// Description, pedido de Rodrigo).
var GRUPOS_DET = [
  ['Coverage answers', ['annual policy','currently insured','quoted elsewhere']],
  ['Business profile', ['naics / sic','description','category','business type','years in business','owner experience']],
  ['Financials', ['revenue','payroll','subcontractors','ft employees']],
  ['Contact', ['email','address','phone']]
];
// Montos que se normalizan a $X,XXX (FT employees es conteo, no dinero)
var MONEY_DET = ['revenue','payroll','subcontractors'];
function grupoDetalles(details){
  var usados = {}, out = [];
  GRUPOS_DET.forEach(function(g){
    var filas = [];
    (details || []).forEach(function(x, i){
      if (usados[i]) return;
      if (g[1].indexOf(String(x[0] || '').toLowerCase().trim()) !== -1) { usados[i] = 1; filas.push(x); }
    });
    // v6.5: orden interno segun la lista del grupo (NAICS/SIC primero)
    filas.sort(function(a, b){
      return g[1].indexOf(String(a[0]).toLowerCase().trim()) - g[1].indexOf(String(b[0]).toLowerCase().trim());
    });
    if (filas.length) out.push({t: g[0], f: filas});
  });
  var resto = [];
  (details || []).forEach(function(x, i){ if (!usados[i]) resto.push(x); });
  if (resto.length) out.push({t: 'Other details', f: resto});
  return out;
}
function filaDet(x){
  var v = String(x[1] === null || x[1] === undefined ? '' : x[1]);
  var etiqueta = String(x[0] || '').toLowerCase().trim();
  var low = v.trim().toLowerCase(), val;
  // v6.5: montos normalizados — el motor a veces manda "300,000" y a
  // veces "$60,000"; aqui salen SIEMPRE como $X,XXX. Solo si el valor
  // es numerico limpio; cualquier otra cosa se muestra tal cual.
  if (MONEY_DET.indexOf(etiqueta) !== -1) {
    var num = v.replace(/[$,\s]/g, '');
    if (/^\d+(\.\d+)?$/.test(num)) v = '$' + Number(num).toLocaleString('en-US');
    low = '';
  }
  if (low === 'yes') val = '<span class="pv yes">Yes</span>';
  else if (low === 'no') val = '<span class="pv no">No</span>';
  else if (etiqueta === 'email' && v.indexOf('@') !== -1)
    val = '<b><a class="dlink" href="mailto:' + esc(v) + '">' + esc(v) + '</a></b>';
  else val = '<b>' + esc(v) + '</b>';
  return '<div class="drow"><span>' + esc(x[0]) + '</span>' + val + '</div>';
}

    .then(function(r){ return r.json(); })

  // v4.1: en modo admin no hay controles de estado ni prompt post-llamada
  if (esAdmin) return;

  // v4.3/v6.5: término de la póliza — default 12, prellenado si ya
  // existe. Los inputs viven en la hoja de confirmacion (se prellenan
  // y se cablean al abrirla).
  var termSel = (j.term === 6) ? 6 : 12;

  var btns = app.querySelectorAll('#sts .st');
  btns.forEach(function(b){
    b.onclick = function(){
      sel = b.getAttribute('data-s');
      selLabel = b.getAttribute('data-l');
      btns.forEach(function(x){ x.classList.remove('sel'); });
      b.classList.add('sel');
      var sv = document.getElementById('save');
      sv.disabled = false;
      sv.textContent = 'Save: ' + selLabel;
    };
  });

  // ── Post-llamada: al volver de marcar, un tap guarda el resultado ──
  var tsLlamada = 0, promptMostrado = false;
  document.getElementById('btn-call').addEventListener('click', function(){
    tsLlamada = Date.now(); promptMostrado = false;
    registrarLlamada(); // v5: conteo + status Called + aviso (motor v23)
  });

  function pantallaExito(dd){
    app.innerHTML =
      '<div class="center">' +
      '<div class="okmark">✓</div>' +
      '<h2>Update saved</h2>' +
      '<p><b>' + esc(dd.id) + '</b> marked as ' + pillEstado(dd.status) + '</p>' +
      (dd.detail ? '<p class="muted">' + esc(dd.detail) + '</p>' : '') +
      '<div><button class="btn-back" onclick="cargar()">Back to lead</button>' +
      '<button class="btn-back sec" onclick="irALeads()">All leads</button></div>' +
      '</div>';
  }

  function guardarRapido(estado, etiqueta){
    var cp = document.getElementById('callprompt');
    if (cp) cp.remove();
    if (!humano && !ADM) return; // v5.5: un sandbox jamás guarda un status
    var url = API + '?api=save&id=' + encodeURIComponent(ID) + '&t=' + encodeURIComponent(T) +
      '&s=' + estado + '&notes=';
    var sv = document.getElementById('save');
    if (sv) { sv.disabled = true; sv.textContent = 'Saving: ' + etiqueta + '...'; }
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) { if (sv) { sv.disabled = false; sv.textContent = 'Select a status above'; }
          var err = document.getElementById('err');
          if (err) err.textContent = d.error || 'Could not save. Try again.'; return; }
        pantallaExito(d);
      })
      .catch(function(){
        if (sv) { sv.disabled = false; sv.textContent = 'Select a status above'; }
        var err = document.getElementById('err');
        if (err) err.textContent = 'Connection error. Your update was not saved — try again.';
      });
  }

  function mostrarPromptLlamada(){
    if (vistaActual !== 'detalle') return;
    if (promptMostrado || !tsLlamada) return;
    if (Date.now() - tsLlamada < 8000) return;
    promptMostrado = true; tsLlamada = 0;
    var div = document.createElement('div');
    div.className = 'callprompt'; div.id = 'callprompt';
    div.innerHTML =
      '<p>How did the call go?</p>' +
      '<div class="cp-row">' +
        '<button type="button" class="cp-btn cp-yes" id="cp-yes">✓ Contacted</button>' +
        '<button type="button" class="cp-btn cp-no" id="cp-no">Not reached</button>' +
      '</div>' +
      '<button type="button" class="cp-later" id="cp-later">I\'ll update it myself</button>';
    document.body.appendChild(div);
    document.getElementById('cp-yes').onclick = function(){ guardarRapido('contacted', 'Contacted'); };
    document.getElementById('cp-no').onclick = function(){ guardarRapido('not_reached', 'Not Reached'); };
    document.getElementById('cp-later').onclick = function(){ div.remove(); };
  }

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') mostrarPromptLlamada();
  });
  window.addEventListener('pageshow', mostrarPromptLlamada);

  // ── v6.5: GUARDADO EN DOS PASOS ──
  // Paso 1: boton Save (savebar) abre la hoja de confirmacion con los
  // campos del status elegido + nota opcional. Paso 2: Confirm & save
  // valida y dispara api=save con EXACTAMENTE los mismos parametros
  // de siempre (contrato con el motor intacto).
  var confirmAbierto = null;
  function cerrarConfirm(){
    if (!confirmAbierto) return;
    var el = confirmAbierto; confirmAbierto = null;
    el.ov.classList.remove('on'); el.sh.classList.remove('on');
    setTimeout(function(){ if (el.ov.parentNode) el.ov.parentNode.removeChild(el.ov);
      if (el.sh.parentNode) el.sh.parentNode.removeChild(el.sh); }, 240);
    var sv = document.getElementById('save');
    if (sv && sel) { sv.disabled = false; sv.textContent = 'Save: ' + selLabel; }
  }
  function camposDeStatus(){
    if (sel === 'sold') {
      return '<label>Policy premium ($) <span class="req">required</span></label>' +
        '<input id="sold_premium" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00">' +
        '<label>Agent commission (%) <span class="opt">optional</span></label>' +
        '<input id="sold_comm" type="number" step="0.01" min="0.01" max="100" inputmode="decimal" placeholder="%">' +
        '<label>Policy term <span class="req">required</span></label>' +
        '<div class="grid" id="term-grid" style="grid-template-columns:1fr 1fr;gap:8px">' +
          '<button type="button" class="st term-btn" data-term="6" style="--c:#2563eb"><span class="dot"></span>6 months</button>' +
          '<button type="button" class="st term-btn" data-term="12" style="--c:#2563eb"><span class="dot"></span>12 months</button>' +
        '</div>';
    }
    if (sel === 'quoted') {
      return '<label>Quoted premium ($) <span class="opt">optional</span></label>' +
        '<input id="quoted_premium" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00">';
    }
    if (sel === 'declined') {
      return '<label>Reason</label><select id="reason">' +
        ['Price too high','Coverage mismatch','No response from client','Slow follow-up',
         'Went with another agent','Not qualified / ineligible','Other']
          .map(function(r){ return '<option>' + r + '</option>'; }).join('') + '</select>';
    }
    return '';
  }
  function abrirConfirmSave(){
    cerrarConfirm();
    var ov = document.createElement('div'); ov.className = 'ov';
    var sh = document.createElement('div'); sh.className = 'sheet';
    sh.innerHTML =
      '<div class="shead"><div><div class="sttl">Save: ' + esc(selLabel) + '</div>' +
        '<div class="ssub">Lead ' + esc(ID) + '</div></div>' +
        '<button type="button" class="sclose" aria-label="Close">&#10005;</button></div>' +
      '<div class="sbody">' + camposDeStatus() +
        '<label>Notes <span class="opt">optional</span></label>' +
        '<textarea id="notes" placeholder="Anything worth noting"></textarea>' +
        '<p id="err" class="errline"></p>' +
        '<button type="button" class="cbtn" id="confirm-save">Confirm &amp; save</button>' +
      '</div>';
    document.body.appendChild(ov); document.body.appendChild(sh);
    ov.addEventListener('click', cerrarConfirm);
    sh.querySelector('.sclose').addEventListener('click', cerrarConfirm);
    confirmAbierto = {ov: ov, sh: sh};
    requestAnimationFrame(function(){ ov.classList.add('on'); sh.classList.add('on'); });
    // Prellenados (mismos de siempre) + termino
    if (sel === 'sold') {
      if (j.premium) document.getElementById('sold_premium').value = j.premium;
      if (j.agent_comm) document.getElementById('sold_comm').value = j.agent_comm;
      var termBtns = sh.querySelectorAll('.term-btn');
      termBtns.forEach(function(tb){
        tb.classList.toggle('sel', parseInt(tb.getAttribute('data-term'), 10) === termSel);
        tb.onclick = function(ev){
          ev.stopPropagation();
          termSel = parseInt(tb.getAttribute('data-term'), 10);
          termBtns.forEach(function(x){ x.classList.remove('sel'); });
          tb.classList.add('sel');
        };
      });
    }
    if (sel === 'quoted' && j.premium) document.getElementById('quoted_premium').value = j.premium;
    document.getElementById('confirm-save').onclick = enviarGuardado;
  }
  function enviarGuardado(){
    var err = document.getElementById('err');
    var cb = document.getElementById('confirm-save');
    err.textContent = '';
    function fallo(msg){ err.textContent = msg; cb.disabled = false; cb.innerHTML = 'Confirm &amp; save'; }
    var params = {api:'save', id:ID, t:T, s:sel, notes:document.getElementById('notes').value};
    if (sel === 'sold') {
      var sp = parseFloat(document.getElementById('sold_premium').value);
      var scRaw = document.getElementById('sold_comm').value;
      var sc = scRaw ? parseFloat(scRaw) : null;
      if (!(sp > 0)) { fallo('Policy premium is required (greater than 0).'); return; }
      if (sc !== null && !(sc > 0 && sc <= 100)) { fallo('Agent commission must be a percentage between 0 and 100, or leave it empty.'); return; }
      params.sold_premium = sp;
      if (sc !== null) params.sold_comm = sc;
      params.sold_term = termSel;
    }
    if (sel === 'quoted') params.quoted_premium = document.getElementById('quoted_premium').value;
    if (sel === 'declined') params.reason = document.getElementById('reason').value;

    cb.disabled = true; cb.textContent = 'Saving...';
    var url = API + '?' + Object.keys(params).map(function(k){
      return k + '=' + encodeURIComponent(params[k] == null ? '' : params[k]); }).join('&');
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) { fallo(d.error || 'Could not save. Try again.'); return; }
        cerrarConfirm();
        pantallaExito(d);
      })
      .catch(function(){ fallo('Connection error. Your changes were not saved — try again.'); });
  }
  document.getElementById('save').onclick = function(){
    if (!sel) return;
    abrirConfirmSave();
  };
}

arrancar();
</script>
</body>
</html>
