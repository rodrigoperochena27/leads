   (6-9% típico, validado 0-100) y se agrega el término de la póliza
   (6 o 12 meses, obligatorio, default 12). El backend v20 calcula
   renewal (Sold At + término) y expected pay (Sold At + 1 mes).
   v4.2 (historial): lista + buscador + filtros + detalle.
   v4.2: en la vista All, sección "Opened — needs action" entre
   "New leads" y "Everything else" (leads que Jenny abrió y dejó sin
   registrar estado recuperan visibilidad).
   v4.1: MODO ADMIN para Rodrigo — entrar con ?admin=1 (código de 6
   dígitos a SU correo, sesión 30 días en localStorage 'jl_admin').
   En modo admin: abrir un lead NO registra apertura ni cambia el
   estado (fetch con &adm=), y el detalle es SOLO LECTURA (sin
   botones de estado ni prompt post-llamada). Badge ADMIN visible.
   Autenticación de Jenny igual que v4; los links por-lead (?id&t)
   siguen entrando directo al detalle sin sesión.
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#17233b;--paper:#f2f4f7;--line:#e7eaf0;--sub:#5a6b85;--wa:#1fab55}
html{background:#e9edf2}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#e9edf2;margin:0;padding:0;color:#101828}
#app{max-width:520px;margin:0 auto;padding:0 0 96px;background:var(--paper);min-height:100vh}
@media (min-width:700px){
  #app{margin:28px auto 40px;border-radius:18px;overflow:hidden;box-shadow:0 8px 40px rgba(16,24,40,.14);min-height:calc(100vh - 68px)}
}

/* ── Header oscuro ── */
.hero{background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 54px}
.hero.flat{padding-bottom:48px}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;color:#8fa3c4;text-transform:uppercase}
.pill{color:#fff;font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;white-space:nowrap}
.hero h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.hero .biz{margin:6px 0 0;font-size:14.5px;color:#c3cede}
.hero .chips{margin-top:12px}
.chip{display:inline-block;background:rgba(255,255,255,.12);color:#e7edf7;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;margin:0 6px 6px 0;border:1px solid rgba(255,255,255,.14)}
.backlink{display:inline-flex;align-items:center;gap:6px;color:#c3cede;font-size:13.5px;font-weight:700;text-decoration:none;background:none;border:0;cursor:pointer;padding:0;margin:0 0 10px}

/* ── Acciones primarias (encimadas al header del detalle) ── */
.acts{display:flex;gap:10px;margin:-32px 16px 14px}
.act{flex:1;display:block;text-align:center;padding:15px 4px;border-radius:14px;text-decoration:none;font-weight:800;font-size:14.5px;white-space:nowrap;box-shadow:0 4px 14px rgba(23,35,59,.18)} /* v6.29: 3 botones */
.act.call{background:#fff;color:var(--ink)}
.act.sms{background:#2563eb;color:#fff} /* v6.29 */
.act.wa{background:var(--wa);color:#fff}

.wrap{padding:0 16px;background:var(--paper)}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line)}
.label{font-size:11px;font-weight:700;letter-spacing:1.4px;color:#98a2b3;margin:0 0 8px;text-transform:uppercase}
/* v6.3: titulos de tarjeta del DETALLE con divisor (lenguaje del modal) */
.card>.label{padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.card.warn>.label{border-bottom-color:#f3e3bd}
.notes ul{margin:0;padding-left:18px}
.notes li{font-size:14.5px;color:#344054;margin-bottom:5px;line-height:1.45}
.card.warn{background:#fffaeb;border-color:#fedf89}
.card.warn .label{color:#b54708}
.card.warn li{color:#7a3b06;font-weight:600}
.card.act-prev{background:#f8fafc;position:relative}
/* v6.6: actividad con tope + degradado + Show all */
.act-prev.clamp .actbody{max-height:210px;overflow:hidden}
.actfade{display:none}
.act-prev.clamp .actfade{display:block;position:absolute;left:0;right:0;bottom:44px;height:60px;background:linear-gradient(rgba(248,250,252,0),#f8fafc)}
.actmore{display:none;width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#344054;font-size:13px;font-weight:700;cursor:pointer}
.act-prev.clamp .actmore{display:block}
.drow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px solid #f2f4f7}
.drow:last-child{border-bottom:0}
.drow span{color:var(--sub)}
.drow b{text-align:right}
/* v6.4: subtitulos de grupo dentro de Full details (movil) */
.gsub{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#b3bcc9;text-transform:uppercase;margin:13px 0 2px}
.inner .gsub:first-child{margin-top:4px}
/* v6.4: pills Yes/No y link de email */
.pv{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px}
.pv.yes{background:#e6f4ee;color:#12805c}
.pv.no{background:#eef0f4;color:#667085}
.dlink{color:#17233b;font-weight:700;text-decoration:none;border-bottom:1px solid #d0d5dd}
/* v6.5/v6.6: tarjeta unica Lead details — grilla etiqueta/valor,
   valor alineado a la IZQUIERDA (nada pegado al borde derecho) */
.card.dets .drow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 12px;padding:6px 0;font-size:13.5px;align-items:start}
.card.dets .drow b{text-align:left;word-break:break-word}
.card.dets .drow .pv{justify-self:start}
.card.dets .gsub{margin:14px 0 3px}
.card.dets .gsub:first-of-type{margin-top:2px}
/* v6.5: hoja de confirmacion de guardado */
.sheet .sbody .cbtn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:13px;border:0;background:var(--ink);color:#fff;font-size:15.5px;font-weight:800;cursor:pointer}
.sheet .sbody .cbtn:disabled{background:#c6cdd8}
.sheet .sbody label{display:block;font-size:13px;font-weight:700;color:#344054;margin:12px 0 6px}
.drow b{text-align:right;color:#101828}
details.card{padding:0;overflow:hidden}
details.card summary{list-style:none;cursor:pointer;padding:15px 18px 12px;font-size:11px;font-weight:700;letter-spacing:1.4px;color:#98a2b3;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin:0 0 2px}
details.card:not([open]) summary{border-bottom:0}
details.card summary::after{content:'+';font-size:16px;color:#98a2b3;font-weight:600;letter-spacing:0}
details[open].card summary::after{content:'–'}
details.card .inner{padding:4px 18px 14px}

/* ── Grilla de estados 2×3 ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.st{position:relative;display:flex;align-items:center;gap:9px;padding:14px 12px;border:1.5px solid var(--line);border-radius:13px;background:#fff;color:#101828;font-size:14.5px;font-weight:700;cursor:pointer;text-align:left;transition:border-color .12s,background .12s}
.st:hover{border-color:#b9c2d0}
.st .dot{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.st.sel{border-color:var(--c);background:color-mix(in srgb, var(--c) 9%, #fff);box-shadow:0 0 0 1px var(--c)}
@supports not (background:color-mix(in srgb,#fff 9%,#fff)){.st.sel{background:#f8fafc}}
.curtag{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:#eef0f4;color:#475467;font-size:9px;font-weight:800;letter-spacing:.8px;padding:3px 9px;border-radius:999px}
.ctx{display:none;background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:11px}
label{display:block;font-size:13px;font-weight:600;color:#344054;margin:9px 0 5px}
label:first-child{margin-top:0}
.req{color:#d92d20;font-weight:600;font-size:11px}
.opt{color:#98a2b3;font-weight:500;font-size:11px}
.hint{margin:4px 0 0;font-size:12px;color:var(--sub)}
input,select,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:11px;font-size:16px;background:#fff;color:#101828}
input:focus,select:focus,textarea:focus{outline:none;border-color:#17233b;box-shadow:0 0 0 3px rgba(23,35,59,.08)}
textarea{height:62px;resize:vertical}
.errline{color:#d92d20;font-size:14px;font-weight:600;min-height:18px;margin:9px 2px 0}

/* ── Barra de guardado fija ── */
.savebar{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(242,244,247,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.save{display:block;width:100%;padding:16px;border:0;border-radius:13px;font-size:16px;font-weight:800;color:#fff;background:var(--ink);cursor:pointer}
.save:disabled{background:#c6cdd8;cursor:default}

/* ── Éxito / errores ── */
.center{text-align:center;padding:60px 24px;background:var(--paper)}
.okmark{width:66px;height:66px;line-height:66px;border-radius:50%;background:#12805c;color:#fff;font-size:34px;font-weight:700;margin:0 auto 14px}
.center h2{margin:0 0 6px;font-size:22px}
.center .muted{color:var(--sub);font-size:14.5px;margin:6px 0 0}
.btn-back{display:inline-block;margin:22px 5px 0;padding:14px 26px;border-radius:13px;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;border:0;font-size:15px;cursor:pointer}
.btn-back.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:80px auto;animation:g .8s linear infinite}

/* ── Prompt post-llamada ── */
.callprompt{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:12px;right:12px;margin:0 auto;max-width:496px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(16,24,40,.18);z-index:20}
.callprompt p{margin:0 0 10px;font-size:15px;font-weight:800;color:#101828}
.callprompt .cp-row{display:flex;gap:9px}
.cp-btn{flex:1;padding:13px;border-radius:12px;border:0;font-size:14.5px;font-weight:800;cursor:pointer}
.cp-yes{background:#12805c;color:#fff}
.cp-no{background:#eef0f4;color:#101828}
.cp-later{display:block;width:100%;margin-top:8px;background:none;border:0;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;padding:6px}
.cp-sms{display:block;width:100%;margin-top:8px;background:#2563eb;color:#fff} /* v6.29 */

/* ── LISTA ── */
.searchwrap{margin:-26px 16px 12px;position:relative}
.searchwrap input{padding:15px 16px;border-radius:14px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(23,35,59,.14);font-size:16px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fl{flex:none;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:#344054;font-size:13.5px;font-weight:700;cursor:pointer}
.fl.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fl .n{opacity:.65;font-weight:600;margin-left:4px}
.groupttl{font-size:11px;font-weight:700;letter-spacing:1.4px;color:#98a2b3;text-transform:uppercase;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.groupttl .badge{background:#0e7490;color:#fff;border-radius:999px;font-size:11px;padding:2px 9px;letter-spacing:0}
.lead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:9px;cursor:pointer;font-family:inherit}
.lead:active{background:#f8fafc}
.lead .lmain{flex:1;min-width:0}
.lead .lname{font-size:15.5px;font-weight:800;color:#101828;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead .lsub{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead .lcov{font-size:12px;color:#475467;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead .lright{flex:none;text-align:right}
.lead .lpill{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.lead .ldate{font-size:11.5px;color:#98a2b3;margin-top:6px;font-weight:600}
.lead .ltimer{display:block;font-size:10.5px;font-weight:800;margin-top:3px;letter-spacing:.2px}
.lt-ok{color:#98a2b3}.lt-warn{color:#d97706}.lt-late{color:#dc2626}
.newdot{width:8px;height:8px;border-radius:50%;background:#0e7490;flex:none;margin-right:-4px}
.empty{color:var(--sub);font-size:14.5px;text-align:center;padding:34px 10px}
.refresh-note{color:#98a2b3;font-size:12px;text-align:center;padding:6px 0 18px}

/* ── Insurance Intel (v6) ── */
.inschip{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#667085;margin-top:3px;min-width:0}
.inschip .idot{width:7px;height:7px;border-radius:50%;flex:none}
.inschip .itxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id-red{background:#dc2626}.id-amber{background:#d97706}.id-ok{background:#12805c}.id-gray{background:#98a2b3}
.insrow{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;cursor:pointer;font-family:inherit;text-align:left}
.insrow:active{background:#f8fafc}
.insrow .idot{width:9px;height:9px;border-radius:50%;flex:none}
.insrow .imain{flex:1;min-width:0}
.insrow .ittl{font-size:11px;font-weight:700;letter-spacing:1.4px;color:#98a2b3;text-transform:uppercase;display:block}
.insrow .ival{font-size:14.5px;font-weight:700;color:#101828;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insrow .ichev{flex:none;color:#98a2b3;font-size:20px;font-weight:600;line-height:1}
.ov{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:40;opacity:0;transition:opacity .18s}
.ov.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:88vh;background:var(--paper);border-radius:20px 20px 0 0;z-index:41;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease-out}
.sheet.on{transform:translateY(0)}
.sheet .shead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line);background:#fff;border-radius:20px 20px 0 0}
.sheet .shead .sttl{font-size:16px;font-weight:800;color:#101828}
.sheet .shead .ssub{font-size:12px;color:var(--sub);font-weight:600;margin-top:2px}
.sheet .sclose{border:0;background:#eef0f4;color:#101828;width:32px;height:32px;border-radius:50%;font-size:16px;font-weight:700;cursor:pointer;flex:none}
.sheet .sbody{overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.icard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:11px}
.icard .label{margin-bottom:10px}
.iband{border-radius:12px;padding:11px 13px;font-size:13.5px;font-weight:700;margin-bottom:11px;line-height:1.4}
.iband.red{background:#fef3f2;border:1px solid #fecdca;color:#b42318}
.iband.amber{background:#fffaeb;border:1px solid #fedf89;color:#b54708}
.iins{font-size:17px;font-weight:800;color:#101828;line-height:1.25;margin:0 0 2px}
.itype{font-size:13px;color:var(--sub);font-weight:600;margin:0 0 10px}
.imetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
.im{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}
.im b{display:block;font-size:15px;color:#101828}
.im span{display:block;font-size:10.5px;color:#98a2b3;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:3px}
.ih{padding:10px 0;border-bottom:1px solid #f2f4f7}
.ih:last-child{border-bottom:0}
.ih .ihi{font-size:13.5px;font-weight:700;color:#101828}
.ih .ihd{font-size:12px;color:var(--sub);margin-top:2px;font-weight:600}
.ih .iht{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.iht.rep{background:#eef4ff;color:#1d4ed8}.iht.can{background:#fef3f2;color:#b42318}
.ifoot{font-size:11.5px;color:#98a2b3;text-align:center;padding:4px 4px 2px;line-height:1.6}
.ifoot a{color:#5a6b85;font-weight:700;text-decoration:none;border-bottom:1px solid #d0d5dd}
/* v6.2: titulos de seccion del modal con divisor (estructura dotsearch) */
.icard .label{padding-bottom:8px;border-bottom:1px solid var(--line)}
/* v6.2: hero del modal */
.shero{flex:none;background:linear-gradient(135deg,#17233b 0%,#233553 100%);color:#fff;padding:16px 18px 14px;border-radius:20px 20px 0 0;position:relative}
.shero .sclose{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.14);color:#fff}
.shero .shname{font-size:18px;font-weight:800;line-height:1.2;margin:0 34px 3px 0;letter-spacing:.2px}
.shero .shloc{font-size:12px;color:#cbd5e1;font-weight:600;margin:0 0 10px}
.shero .shpills{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.3px}
.pchip.ok{background:#12805c;color:#fff}
.pchip.slate{background:rgba(255,255,255,.16);color:#e2e8f0}
.pchip.red{background:#b42318;color:#fff}
.shstats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.shs{background:#fff;border-radius:13px;padding:10px 8px;text-align:center}
.shs b{display:block;font-size:22px;color:#17233b;line-height:1.1}
.shs span{display:block;font-size:9.5px;color:#98a2b3;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
/* v6.2: tabs */
.stabs{flex:none;display:flex;background:#fff;border-bottom:1px solid var(--line)}
.stab{flex:1;border:0;background:none;font-family:inherit;font-size:13.5px;font-weight:700;color:#667085;padding:12px 4px 10px;cursor:pointer;border-bottom:2.5px solid transparent} /* v6.14: 4 tabs */
.stab.on{color:#17233b;border-bottom-color:#17233b}
/* v6.14 (Fase 4): 4 tabs en pantallas muy angostas + tabla BASIC +
   timeline. OJO: nada de esto toca .sheet global (Confirm & save). */
@media (max-width:340px){.stab{font-size:12px;padding:12px 2px 10px}}
.btbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.btbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#98a2b3;font-weight:700;text-align:right;padding:0 0 6px 8px}
.btbl th:first-child{text-align:left;padding-left:0}
.btbl td{padding:7px 0 7px 8px;border-top:1px solid var(--line);text-align:right;font-weight:700;color:#17233b}
.btbl td:first-child{text-align:left;padding-left:0;font-weight:600;color:#344054}
.btbl td.boos{color:#b42318}
.tl{position:relative;padding:2px 0 2px 16px}
.tl:before{content:'';position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tle{position:relative;padding:0 0 14px}
.tle:last-child{padding-bottom:0}
.tle:before{content:'';position:absolute;left:-16px;top:3px;width:8px;height:8px;border-radius:50%;background:#98a2b3;border:2px solid #fff;box-shadow:0 0 0 1px #e4e7ec}
.tle.ok:before{background:#12805c}
.tle.gap:before{background:#b42318}
.tlt{font-size:12.5px;font-weight:700;color:#17233b;margin:0}
.tle.gap .tlt{color:#b42318}
.tlm{font-size:11.5px;color:#667085;margin:1px 0 0}
/* v6.16 (Fase 4B): filas de Related companies */
.relr+.relr{border-top:1px solid var(--line);margin-top:9px;padding-top:9px}
/* v6.18 (Fase 4D): bullets de talking points */
.tpul{margin:4px 0 0;padding-left:17px}
.tpul li{font-size:12.5px;font-weight:600;color:#17233b;margin:4px 0;line-height:1.35}
/* v6.27: tap-to-copy en Lead details + reloj del cliente */
.dets .drow,details.card .drow{cursor:pointer}
.dets .drow:active,details.card .drow:active{background:#f2f4f7}
.drow.tzrow{cursor:default}

<body>
<div id="app"><div class="spin"></div></div>

<script>
// ====== CONFIGURA ESTO: tu URL /exec del Apps Script ======
var API = 'https://script.google.com/macros/s/AKfycbw3vDEX509WAsvwrT6exgib4z4tFknocNAr82uxvDrR2u9NYRMyLM7aOqJWrNERCqSZ/exec';
// ===========================================================

var app = document.getElementById('app');
var COLORES = {'New / Transferred':'#667085','Opened':'#0e7490','Called':'#7c3aed','Contacted':'#12805c',
  'Not Reached':'#667085','Follow-Up':'#dc6803','Quoted':'#1d4ed8','Bound / Sold':'#14532d',
  'Declined':'#d92d20','Dead / Lost':'#344054'};
var ETIQ = {'New / Transferred':'New','Bound / Sold':'Sold','Dead / Lost':'Lost'};
var OPCIONES = [
  ['contacted','Contacted','#12805c','Contacted'],
  ['not_reached','Not Reached','#667085','Not Reached'],
  ['followup','Follow-Up','#dc6803','Follow-Up'],
  ['quoted','Quoted','#1d4ed8','Quoted'],
  ['sold','Sold','#14532d','Bound / Sold'],
  ['declined','Declined','#d92d20','Declined']
];
// Filtros de la lista: [id, etiqueta, estados que agrupa (null = todos)]
var FILTROS = [
  ['all','All', null],
  ['new','New', ['New / Transferred']],
  ['opened','Opened', ['Opened']],
  ['called','Called', ['Called']],
  ['working','In progress', ['Contacted','Not Reached','Follow-Up']],
  ['quoted','Quoted', ['Quoted']],
  ['sold','Sold', ['Bound / Sold']],
  ['closed','Closed', ['Declined','Dead / Lost']]
];

var SES = null, ADM = null;
try { SES = localStorage.getItem('jl_session') || null; } catch (e) {}
try { ADM = localStorage.getItem('jl_admin') || null; } catch (e) {}
var LISTA = [];            // cache de api=list
var filtroActivo = 'all';
var textoBusqueda = '';
var vistaActual = '';      // 'lista' | 'detalle' | 'otp'
var LEAD = null, ID = null, T = null;
var sel = null, selLabel = '';
var pollTimer = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pillEstado(st, extra){
  return '<span class="' + (extra || 'pill') + '" style="background:' + (COLORES[st] || '#667085') + '">' +
    esc(ETIQ[st] || st) + '</span>';
}
function guardarSesion(s){ SES = s; try { localStorage.setItem('jl_session', s); } catch (e) {} }
function borrarSesion(){ SES = null; try { localStorage.removeItem('jl_session'); localStorage.removeItem('jl_lista_v1'); } catch (e) {} }
function guardarAdmin(s){ ADM = s; try { localStorage.setItem('jl_admin', s); } catch (e) {} }
function borrarAdmin(){ ADM = null; try { localStorage.removeItem('jl_admin'); localStorage.removeItem('jl_lista_v1'); } catch (e) {} }
function salirAdmin(){ borrarAdmin(); history.pushState({}, '', location.pathname); arrancar(); }

// ============================================================
//  ARRANQUE Y NAVEGACIÓN
//  ?id&t → detalle directo (links de correo, con o sin sesión).
//  ?admin=1 → login de ADMIN (código al correo de Rodrigo).
//  Sin parámetros → lista (pide código si no hay sesión).
// ============================================================
function arrancar(){
  var qs = new URLSearchParams(location.search);
  ID = qs.get('id'); T = qs.get('t');
  if (qs.get('admin') && !ADM) { verOtp(true); return; }
  if (ID && T) { verDetalle(ID, T, false); }
  else if (SES || ADM) { verLista(); }
  else { verOtp(false); }
}
window.addEventListener('popstate', arrancar);

function irADetalle(id, t){
  history.pushState({}, '', location.pathname + '?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t));
  verDetalle(id, t, true);
}
function volverALista(){
  cerrarSeguro();
  history.pushState({}, '', location.pathname);
  verLista();
}
// A la lista (con sesión) o a la pantalla de código (sin sesión).
function irALeads(){
  history.pushState({}, '', location.pathname);
  if (SES || ADM) verLista(); else verOtp(false);
}

// ============================================================
//  VISTA: CÓDIGO DE ACCESO
// ============================================================
// v4.1: esAdmin=true → código al correo de Rodrigo, sesión jl_admin.
function verOtp(esAdmin){
  vistaActual = 'otp';
  var who = esAdmin ? '&who=admin' : '';
  // v6.7: pantalla completa centrada. MISMOS ids, MISMA logica.
  app.innerHTML =
    '<div class="authwrap">' +
      '<div class="authbrand">' +
        '<span class="eyebrow">Lead Panel' + (esAdmin ? ' · ADMIN' : '') + '</span>' +
        '<h1>' + (esAdmin ? 'Admin access' : 'Welcome, Kateryna') + '</h1>' +
        '<p>' + (esAdmin ? 'Read-only mode. Opening leads will not affect anything.' : 'Your leads, in one place.') + '</p>' +
      '</div>' +
      '<div class="authcard">' +
        '<h2>Verify it\'s you</h2>' +
        '<p>Tap the button and we\'ll email a 6-digit code to ' + (esAdmin ? 'Rodrigo\'s inbox' : 'your inbox') + '. You\'ll only need to do this once on this device.</p>' +
        '<button class="btn-full" id="btn-send">Email me a code</button>' +
        '<div id="otp-step2" style="display:none">' +
          '<label style="margin-top:18px">Access code</label>' +
          '<input id="otp-code" class="otpcode" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="one-time-code">' +
          '<button class="btn-full" id="btn-verify">Enter</button>' +
          '<button class="btn-ghost" id="btn-resend">Send a new code</button>' +
        '</div>' +
        '<p id="otp-err" class="errline"></p>' +
      '</div>' +
      '<p class="authfoot">Secured with one-time email codes.</p>' +
    '</div>';

  var err = document.getElementById('otp-err');
  function pedirCodigo(btn){
    btn.disabled = true; btn.textContent = 'Sending...'; err.textContent = '';
    fetch(API + '?api=otp_request&t=k' + who).then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) { err.textContent = d.error || 'Could not send the code.'; btn.disabled = false; btn.textContent = 'Email me a code'; return; }
        document.getElementById('btn-send').style.display = 'none';
        document.getElementById('otp-step2').style.display = 'block';
        document.getElementById('otp-code').focus();
        btn.disabled = false;
      })
      .catch(function(){ err.textContent = 'Connection error. Try again.'; btn.disabled = false; btn.textContent = 'Email me a code'; });
  }
  document.getElementById('btn-send').onclick = function(){ pedirCodigo(this); };
  document.getElementById('btn-resend').onclick = function(){
    var b = this; b.disabled = true; b.textContent = 'Sending...';
    fetch(API + '?api=otp_request&t=k' + who).then(function(r){ return r.json(); })
      .then(function(d){
        err.textContent = d.ok ? '' : (d.error || 'Could not send the code.');
        b.disabled = false; b.textContent = 'Send a new code';
        if (d.ok) document.getElementById('otp-code').focus();
      })
      .catch(function(){ err.textContent = 'Connection error.'; b.disabled = false; b.textContent = 'Send a new code'; });
  };
  document.getElementById('btn-verify').onclick = function(){
    var code = document.getElementById('otp-code').value.trim();
    if (code.length !== 6) { err.textContent = 'Enter the 6-digit code from your email.'; return; }
    var b = this; b.disabled = true; b.textContent = 'Checking...'; err.textContent = '';
    fetch(API + '?api=otp_verify&t=k&code=' + encodeURIComponent(code) + who)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) { err.textContent = d.error || 'Incorrect code.'; b.disabled = false; b.textContent = 'Enter'; return; }
        if (esAdmin) guardarAdmin(d.session); else guardarSesion(d.session);
        history.pushState({}, '', location.pathname);
        verLista();
      })
      .catch(function(){ err.textContent = 'Connection error. Try again.'; b.disabled = false; b.textContent = 'Enter'; });
  };
}

// ============================================================
//  VISTA: LISTA DE LEADS (buscador + filtros + refresco 60s)
// ============================================================
function verLista(){
  vistaActual = 'lista';
  // v4.4: pintar AL INSTANTE desde la última lista conocida y traer la
  // versión fresca en segundo plano (el repintado es imperceptible).
  if (!LISTA.length) {
    try { LISTA = JSON.parse(localStorage.getItem('jl_lista_v1') || '[]'); } catch (e) { LISTA = []; }
    if (!(LISTA instanceof Array)) LISTA = [];
  }
  if (LISTA.length) { pintarLista(true); cargarLista(false); }
  else { app.innerHTML = '<div class="spin"></div>'; cargarLista(true); }
}

function cargarLista(render){
  if (!SES && !ADM) { verOtp(false); return; }
  var auth = ADM ? '&adm=' + encodeURIComponent(ADM) : '&s=' + encodeURIComponent(SES);
  fetch(API + '?api=list&t=k' + auth)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.ok) {
        if (ADM) { borrarAdmin(); verOtp(true); } else { borrarSesion(); verOtp(false); }
        return;
      }
      LISTA = d.leads || [];
      try { localStorage.setItem('jl_lista_v1', JSON.stringify(LISTA)); } catch (e) {}
      prefetchDetalles(); // v6.28: los proximos opens salen del cache
      if (vistaActual === 'lista') pintarLista(render);
    })
    .catch(function(){
      if (render && vistaActual === 'lista') {
        app.innerHTML = '<div class="center"><h2>Connection error</h2>' +
          '<p class="muted">Check your signal.</p>' +
          '<button class="btn-back" onclick="verLista()">Retry</button></div>';
      }
    });
}

function filtrar(){
  var f = null;
  for (var i = 0; i < FILTROS.length; i++) if (FILTROS[i][0] === filtroActivo) f = FILTROS[i];
  var q = textoBusqueda.trim().toLowerCase();
  var qDig = q.replace(/\D/g, '');
  return LISTA.filter(function(l){
    if (f && f[2] && f[2].indexOf(l.status) === -1) return false;
    if (!q) return true;
    var blob = (l.id + ' ' + l.name + ' ' + l.business + ' ' + l.type + ' ' +
      l.state + ' ' + l.status + ' ' + (l.coverages || []).join(' ')).toLowerCase();
    if (blob.indexOf(q) !== -1) return true;
    if (qDig.length >= 3 && l.phone10 && l.phone10.indexOf(qDig) !== -1) return true;
    return false;
  });
}

// v5.4: contador vivo en TODOS los estados hasta cerrar: New (desde
// el envío), Opened (desde la apertura), Called / Contacted / Not
// Reached / Follow-Up / Quoted (desde la última acción de Jenny =
// updated_ts). Bound / Sold, Declined y Dead / Lost: sin contador.
var SIN_CONTADOR = {'Bound / Sold':1, 'Declined':1, 'Dead / Lost':1};
function tsContador(l){
  if (SIN_CONTADOR[l.status]) return 0;
  if (l.status === 'New / Transferred') return l.sent_ts || 0;
  if (l.status === 'Opened') return l.opened_ts || l.sent_ts || 0;
  return l.updated_ts || l.opened_ts || l.sent_ts || 0;
}
function htmlContador(l){
  var ts = tsContador(l);
  if (!ts) return '';
  var min = Math.max(0, Math.floor((Date.now() - ts) / 60000));
  var txt, cls;
  if (min < 60) txt = min + 'm';
  else if (min < 1440) txt = Math.floor(min / 60) + 'h ' + (min % 60) + 'm';
  else txt = Math.floor(min / 1440) + 'd ' + Math.floor((min % 1440) / 60) + 'h';
  cls = min < 60 ? 'lt-ok' : (min < 1440 ? 'lt-warn' : 'lt-late');
  return '<span class="ltimer ' + cls + '">\u23F1 ' + txt + '</span>';
}

// v4.2: cuerpo de la lista compartido por pintarLista y repintarFilas.
// v5.1: en la vista All sin búsqueda: New leads → Opened (needs
// action) → Called (pending update) → Everything else.
function construirCuerpo(){
  var visibles = filtrar();
  if (!visibles.length) {
    return '<p class="empty">' + (textoBusqueda ? 'No leads match your search.' : 'No leads here yet.') + '</p>';
  }
  if (filtroActivo === 'all' && !textoBusqueda) {
    // v5.4: en All no aparecen los cerrados — viven en los chips
    // Sold / Closed (la búsqueda por nombre sí los encuentra).
    visibles = visibles.filter(function(l){ return !SIN_CONTADOR[l.status]; });
    if (!visibles.length) {
      return '<p class="empty">No open leads. Use the Sold / Closed filters to see finished leads.</p>';
    }
    // v5.3: cada grupo ordenado por su timestamp de acción (tsContador),
    // lo más reciente arriba — el timer sube de arriba hacia abajo.
    var porAccion = function(a, b){ return tsContador(b) - tsContador(a); };
    var nuevos = visibles.filter(function(l){ return l.status === 'New / Transferred'; }).sort(porAccion);
    var abiertos = visibles.filter(function(l){ return l.status === 'Opened'; }).sort(porAccion);
    var llamados = visibles.filter(function(l){ return l.status === 'Called'; }).sort(porAccion);
    if (nuevos.length || abiertos.length || llamados.length) {
      var resto = visibles.filter(function(l){
        return l.status !== 'New / Transferred' && l.status !== 'Opened' && l.status !== 'Called'; });
      return (nuevos.length ? '<p class="groupttl">New / Transferred — Open Now <span class="badge">' + nuevos.length + '</span></p>' +
                nuevos.map(filaLead).join('') : '') +
             (abiertos.length ? '<p class="groupttl">Opened — Needs Action <span class="badge">' + abiertos.length + '</span></p>' +
                abiertos.map(filaLead).join('') : '') +
             (llamados.length ? '<p class="groupttl">Called — Pending Status <span class="badge">' + llamados.length + '</span></p>' +
                llamados.map(filaLead).join('') : '') +
             (resto.length ? '<p class="groupttl">Everything Else</p>' + resto.map(filaLead).join('') : '');
    }
  }
  return visibles.map(filaLead).join('');
}

// ============================================================
function smsCount(){
  var c = 0;

}
function smsHref(l){

  var linea = (l.coverages && l.coverages.length) ? String(l.coverages[0]) : 'seguro comercial';

// ============================================================
//  INSURANCE INTEL (v6) — condicional al DOT. Data del motor v24:
//  api=list trae l.dot + l.ins (chip {n,s,e}); api=lead trae
//  d.dot + d.insurance (objeto completo); api=insurance reintenta
//  la carga cuando la celda sigue pendiente (throttle en el motor).
// ============================================================
var FORM_HUMANO = {'91':'Liability (BI&PD)','91X':'Liability (BI&PD)','34':'Cargo','84':'Surety Bond','85':'Trust Fund'};
function tipoHumano(code){
  var c = String(code || '').toUpperCase();
  return FORM_HUMANO[c] || (c ? 'Form ' + c : '');
}
function metodoHumano(m){
  var s = String(m || '').toUpperCase();
  if (s.indexOf('REPL') !== -1) return ['Replaced','rep'];
  if (s.indexOf('CANC') !== -1 || s === 'CANCEL') return ['Cancelled','can'];
  return [m || '', 'rep'];
}
function fFecha(mdY){ // 'MM/DD/YYYY' -> 'Mar 1, 2019' (o el crudo si no parsea)
  var m = String(mdY || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return String(mdY || '');
  var MES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return MES[parseInt(m[1],10)-1] + ' ' + parseInt(m[2],10) + ', ' + m[3];
}
function tsDe(mdY){
  var m = String(mdY || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? new Date(parseInt(m[3],10), parseInt(m[1],10)-1, parseInt(m[2],10)).getTime() : 0;
}
// Renovación proyectada: próximo aniversario de la fecha efectiva.
function renovacion(effTs){
  if (!effTs) return null;
  var eff = new Date(effTs), hoy = new Date();
  var r = new Date(hoy.getFullYear(), eff.getMonth(), eff.getDate());
  if (r.getTime() <= hoy.getTime()) r = new Date(hoy.getFullYear()+1, eff.getMonth(), eff.getDate());
  var dias = Math.ceil((r.getTime() - hoy.getTime()) / 864e5);
  var MES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return {fecha: MES[r.getMonth()] + ' ' + r.getDate() + ', ' + r.getFullYear(), dias: dias};
}
// Estado visual del chip: parte del c.s del motor y aplica la regla
// cliente de renovación <= 90 días (ambar) sobre los 'ok'.
function estadoChip(ins){
  if (!ins) return null;
  var s = ins.s, ren = null;
  if (s === 'ok' && ins.e) {
    ren = renovacion(ins.e);
    if (ren && ren.dias <= 90) s = 'amber';
  }
  return {s: s, n: ins.n || '', ren: ren};
}
function claseDot(s){
  return s === 'red' ? 'id-red' : (s === 'amber' ? 'id-amber' : (s === 'ok' ? 'id-ok' : 'id-gray'));
}
// Chip de la LISTA: una sola línea discreta. Sin DOT: cadena vacía
// (cero cambios de layout).
function chipSeguroLista(l){
  if (!l.dot) return '';
  // v6.1: superficie minima — texto fijo, el color cuenta la historia
  // y el detalle vive en el sheet. La tarjeta no crece de ancho ni
  // carga nombres largos de aseguradoras.
  var e = estadoChip(l.ins);
  return '<span class="inschip"><span class="idot ' + claseDot(e ? e.s : 'gray') +
    '"></span><span class="itxt">FMCSA filing</span></span>';
}

// Historial: dedup exacto + sin duración cuando el feed federal trae
// fechas incoherentes (cancelled < effective — ocurre en carriers
// grandes con cadenas de reemplazo).
function historialLimpio(hist){
  var visto = {}, out = [];
  (hist || []).forEach(function(h){
    var k = [h.insurer, h.type, h.effective, h.cancelled, h.method].join('|');
    if (visto[k]) return; visto[k] = 1; out.push(h);
  });
  return out;
}
function cuerpoSeguro(ins){

  if (act) {

      (ren ? '<div class="drow"><span>Projected renewal</span><b>' + esc(ren.fecha) + ' (' + ren.dias + 'd)</b></div>' : '') +
      '</div>';
    var extras = (ins.active_all || []).slice(1);
    if (extras.length) {
      H += '<div class="icard"><p class="label">Other active filings</p>' +

  } else if (ins.carrier && ins.carrier.exists === false) {

  var hist = historialLimpio(ins.history);
  var aseguradoras = {};
  hist.forEach(function(h){ if (h.insurer) aseguradoras[h.insurer] = 1; });
  if (act && act.insurer) aseguradoras[act.insurer] = 1;
  var nIns = Object.keys(aseguradoras).length;
  var tenencia = '-';
  if (act) {
    var ts = tsDe(act.effective);
    if (ts) {
      var meses = Math.max(0, Math.floor((Date.now() - ts) / (30.44 * 864e5)));

    }
  }

    '<div class="im"><b>' + esc(tenencia) + '</b><span>With insurer</span></div>' +
    '<div class="im"><b>' + nIns + '</b><span>Insurers on record</span></div>' +
    '<div class="im"><b>' + hist.length + '</b><span>Past filings</span></div>' +
    '</div>';

  // 3) Historial
  if (hist.length) {
    H += '<div class="icard"><p class="label">Policy history</p>' +
      hist.map(function(h){

        var e1 = tsDe(h.effective), e2 = tsDe(h.cancelled);
        var periodo = fFecha(h.effective) + ' \u2013 ' + fFecha(h.cancelled);
        var dur = '';
        if (e1 && e2 && e2 >= e1) {
          var dd = Math.round((e2 - e1) / 864e5);
          dur = dd >= 365 ? ' \u00b7 ' + (dd / 365).toFixed(1).replace('.0','') + 'y'
              : dd >= 30 ? ' \u00b7 ' + Math.round(dd / 30) + 'mo' : ' \u00b7 ' + dd + 'd';
        }

          '<span class="iht ' + mm[1] + '">' + esc(mm[0]) + '</span></div>' +
          '<div class="ihd">' + esc(tipoHumano(h.type)) + ' \u00b7 ' + esc(periodo) + esc(dur) + '</div></div>';
      }).join('') + '</div>';
  }

  H += '<p class="ifoot">FMCSA L&amp;I data \u00b7 Updated ' + esc(ins.updated_at || '') +
    (hist.length >= 20 ? ' \u00b7 Last 20 filings shown' : '') + '<br>' +
    '<a href="https://safer.fmcsa.dot.gov/query.asp?searchtype=ANY&query_type=queryCarrierSnapshot&query_param=USDOT&query_string=' +
    encodeURIComponent(ins.dot || '') + '" target="_blank" rel="noopener">View SAFER snapshot</a></p>';
  return H;
}

function fmtPct(n){

        {hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true,
         timeZone: el.getAttribute('data-tz')}).format(new Date());

// Tap en una fila de Lead details = copiar el VALOR. Los links
// mailto:/tel: conservan su accion; la fila del reloj no copia.
function copiarLegacy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function copiarTexto(txt){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(toastCopiado,
      function(){ copiarLegacy(txt); toastCopiado(); });
  } else { copiarLegacy(txt); toastCopiado(); }
}
var _toastT = null;
function toastCopiado(){
  var el = document.getElementById('copytoast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'copytoast'; el.className = 'copytoast';
    el.textContent = 'Copied to clipboard';
    document.body.appendChild(el);
  }
  el.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(function(){ el.classList.remove('show'); }, 1400);
}
document.addEventListener('click', function(ev){

});

var GRUPOS_DET = [
  ['Contact', ['email','address','phone']],
  ['Business profile', ['naics / sic','description','category','business type','years in business','owner experience']],
  ['Financials', ['revenue','payroll','subcontractors','ft employees']],
  ['Coverage answers', ['annual policy','currently insured','quoted elsewhere']]
];
// Montos que se normalizan a $X,XXX (FT employees es conteo, no dinero)
var MONEY_DET = ['revenue','payroll','subcontractors'];
function grupoDetalles(details){
  var usados = {}, out = [];
  GRUPOS_DET.forEach(function(g){
    var filas = [];
    (details || []).forEach(function(x, i){
      if (usados[i]) return;
      if (g[1].indexOf(String(x[0] || '').toLowerCase().trim()) !== -1) { usados[i] = 1; filas.push(x); }
    });
    // v6.5: orden interno segun la lista del grupo (NAICS/SIC primero)
    filas.sort(function(a, b){
      return g[1].indexOf(String(a[0]).toLowerCase().trim()) - g[1].indexOf(String(b[0]).toLowerCase().trim());
    });
    if (filas.length) out.push({t: g[0], f: filas});
  });
  var resto = [];
  (details || []).forEach(function(x, i){ if (!usados[i]) resto.push(x); });
  if (resto.length) out.push({t: 'Other details', f: resto});
  return out;
}
function filaDet(x){
  var v = String(x[1] === null || x[1] === undefined ? '' : x[1]);
  var etiqueta = String(x[0] || '').toLowerCase().trim();
  var low = v.trim().toLowerCase(), val;
  // v6.5: montos normalizados — el motor a veces manda "300,000" y a
  // veces "$60,000"; aqui salen SIEMPRE como $X,XXX. Solo si el valor
  // es numerico limpio; cualquier otra cosa se muestra tal cual.
  if (MONEY_DET.indexOf(etiqueta) !== -1) {
    var num = v.replace(/[$,\s]/g, '');
    if (/^\d+(\.\d+)?$/.test(num)) v = '$' + Number(num).toLocaleString('en-US');
    low = '';
  }
  if (low === 'yes') val = '<span class="pv yes">Yes</span>';
  else if (low === 'no') val = '<span class="pv no">No</span>';
  else if (etiqueta === 'email' && v.indexOf('@') !== -1)
    val = '<b><a class="dlink" href="mailto:' + esc(v) + '">' + esc(v) + '</a></b>';
  else val = '<b>' + esc(v) + '</b>';
  return '<div class="drow"><span>' + esc(x[0]) + '</span>' + val + '</div>';
}

function cerrarVerify(){
  if (!vfyAbierto) return;
  var el = vfyAbierto; vfyAbierto = null;
  el.ov.classList.remove('on'); el.sh.classList.remove('on');
  setTimeout(function(){ if (el.ov.parentNode) el.ov.parentNode.removeChild(el.ov);

function abrirVerify(vPre){ // v6.22: acepta verify precargado de api=lead
  cerrarVerify();
  var ov = document.createElement('div'); ov.className = 'ov';
  var sh = document.createElement('div'); sh.className = 'sheet sheet--vfy';
  document.body.appendChild(ov); document.body.appendChild(sh);
  ov.addEventListener('click', cerrarVerify);
  sh.addEventListener('click', function(e){ // v6.20: X delegado
    if (e.target && e.target.id === 'vfy-x') cerrarVerify();
  });
  vfyAbierto = {ov: ov, sh: sh};
  requestAnimationFrame(function(){ ov.classList.add('on'); sh.classList.add('on'); });
  if (vPre) { armarVerifySheet(sh, vPre); return; } // instantaneo
  sh.innerHTML = vHeadHTML('') +
    '<div style="padding:0 18px 18px"><p class="ocap">Loading verification\u2026</p></div>';
  cargarVerify(sh);
}

function cargarVerify(sh){
  fetch(API + '?api=verify&id=' + encodeURIComponent(ID) + '&t=' + encodeURIComponent(T) +
      (ADM ? '&adm=' + encodeURIComponent(ADM) : ''))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!vfyAbierto || vfyAbierto.sh !== sh) return;
      if (!j.ok) { sh.innerHTML = vHeadHTML('') +
        '<div style="padding:0 18px 18px"><p class="ocap">' + esc(j.error || 'Could not load.') + '</p></div>'; return; }
      armarVerifySheet(sh, j.verify);
    })
    .catch(function(){
      if (!vfyAbierto || vfyAbierto.sh !== sh) return;
      sh.innerHTML = vHeadHTML('') +
        '<div style="padding:0 18px 18px"><p class="ocap">Network error \u2014 close and try again.</p></div>';
    });
}

// Chip por estado de celda — la AUSENCIA tambien es informacion.
function vChip(st){
  if (st === 'VERIFIED' || st === 'OK' || st === 'OBSERVED') return '<span class="achip ok">Verified</span>';
  if (st === 'FOUND') return '<span class="achip warn">Records found</span>';
  if (st === 'NOT_FOUND_FLAG') return '<span class="achip bad">Not found \u2014 review</span>';
  if (st === 'NOT_FOUND_EXPECTED') return '<span class="achip">Not found (expected)</span>';
  if (st === 'NOT_FOUND') return '<span class="achip">No automated findings</span>';
  if (st === 'DEEPLINK') return '<span class="achip">Manual check</span>';
  if (st === 'INFO') return '<span class="achip">Info</span>';
  if (st === 'SKIPPED') return '<span class="achip">Not run</span>';
  return '<span class="achip">N/A</span>';
}
function vChipGlobal(v){
  if (!v) return '<span class="achip">Pending</span>';
  if ((v.flags || []).length || (v.reg && v.reg.st === 'NOT_FOUND_FLAG'))
    return '<span class="achip bad">Review</span>';
  if (v.reg && v.reg.st === 'VERIFIED') return '<span class="achip ok">Verified</span>';
  return '<span class="achip warn">Partial</span>';
}
function vLink(url, txt){
  if (!url) return '';
  return '<a class="vlink" target="_blank" rel="noopener" href="' + esc(url) + '">' + esc(txt) + '</a>';
}

function armarVerifySheet(sh, v){
  if (!v) {
    sh.innerHTML = vHeadHTML('<span class="achip">Pending</span>') +
      '<div style="padding:0 18px 18px"><p class="ocap">Verification is still running for this lead \u2014 it fills in automatically shortly after the lead arrives. Close and reopen in a minute.</p></div>';
    return;
  }
  sh.innerHTML = vHeadHTML(vChipGlobal(v)) +
    '<div class="stabs">' +
      '<button type="button" class="stab on" data-tab="vfy">Verify</button>' +
      '<button type="button" class="stab" data-tab="fng">Fingerprint</button>' +
      '<button type="button" class="stab" data-tab="bch">Benchmarks</button></div>' +
    '<div class="sbody" id="vbody"></div>';
  var cuerpo = sh.querySelector('#vbody');
  function pintar(cual){
    cuerpo.innerHTML = (cual === 'fng') ? vTabFingHTML(v)
      : (cual === 'bch') ? vTabBenchHTML(v) : vTabVerifyHTML(v);
    cuerpo.scrollTop = 0;

// v6.28 (velocidad): tras pintar la lista, los detalles de los
// primeros leads SIN cache se piden en segundo plano y quedan en
// localStorage — abrirlos despues pinta al instante (mecanismo
// cache-first de v6.6). api=lead NO registra aperturas (v23.3), asi
// que el prefetch no contamina metricas. Escalonado 350ms.
function prefetchDetalles(){
  try {
    var cand = [];
    for (var i = 0; i < LISTA.length && cand.length < 6; i++) {
      var l = LISTA[i];
      if (!l || !l.id || !l.t) continue;
      var hay = null;
      try { hay = localStorage.getItem('jl_lead_v1_' + l.id); } catch (e) {}
      if (!hay) cand.push(l);
    }
    var k = 0;
    (function uno(){
      if (k >= cand.length) return;
      var l = cand[k++];
      fetch(API + '?api=lead&id=' + encodeURIComponent(l.id) + '&t=' + encodeURIComponent(l.t) +
        (ADM ? '&adm=' + encodeURIComponent(ADM) : ''))
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d.ok) { try { localStorage.setItem('jl_lead_v1_' + l.id, JSON.stringify(d)); } catch (e) {} }
        })
        .catch(function(){})
        .then(function(){ setTimeout(uno, 350); });
    })();
  } catch (e) {}
}

  // completo. Los links de correo (sin lista cargada) conservan el
  // spinner. El registro de apertura sigue siendo api=lead: nada
  // cambia en las métricas.
  // v6.6: cache por lead — si ya lo visitamos, el detalle COMPLETO
  // pinta al instante y api=lead refresca en segundo plano.
  var cacheado = null;
  try { cacheado = JSON.parse(localStorage.getItem('jl_lead_v1_' + id) || 'null'); } catch (e) {}
  if (cacheado && cacheado.ok) {
    LEAD = cacheado; render();

    var prev = null;
    for (var i = 0; i < LISTA.length; i++) if (LISTA[i].id === id) { prev = LISTA[i]; break; }

  }

  // admin_expired sin registrar apertura si la sesión venció.
  cargarDetalle();

function cargarDetalle(){
  fetch(API + '?api=lead&id=' + encodeURIComponent(ID) + '&t=' + encodeURIComponent(T) +
      (ADM ? '&adm=' + encodeURIComponent(ADM) : ''))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.ok) {
        // v4.4: sesión admin vencida — pedir código nuevo (el motor NO
        // registró la apertura).
        if (d.admin_expired) { borrarAdmin(); verOtp(true); return; }
        if (vistaActual !== 'detalle') return; // v4.4: el usuario ya navegó
        app.innerHTML = '<div class="center"><h2>Invalid link</h2><p class="muted">' +
          esc(d.error || 'This link does not match any lead.') + '</p>' +
          '<button class="btn-back" onclick="irALeads()">All leads</button></div>';
        return;
      }
      if (vistaActual !== 'detalle') return; // v4.4: el usuario ya navegó
      // v6.6: guardar cache y re-renderizar SOLO si la data cambio y
      // la agente no esta a mitad de una seleccion (sel === null).
      if (d && d.ms) { try { console.log('[perf] api=lead server ' + d.ms + 'ms'); } catch (eP) {} } // v6.28
      var igual = false;
      try { igual = JSON.stringify(LEAD) === JSON.stringify(d); } catch (e) {}
      try { localStorage.setItem('jl_lead_v1_' + ID, JSON.stringify(d)); } catch (e) {}
      if (igual) return;
      if (sel !== null && LEAD && LEAD.id === d.id) { LEAD = d; return; } // data fresca sin pisar el click
      LEAD = d; render();
    })
    .catch(function(){
      if (vistaActual !== 'detalle') return; // v4.4: el usuario ya navegó
      app.innerHTML = '<div class="center"><h2>Connection error</h2>' +
        '<p class="muted">Check your signal and reload the page.</p></div>';
    });
}

    var ov = document.createElement('div'); ov.className = 'ov';
    var sh = document.createElement('div'); sh.className = 'sheet';
    sh.innerHTML =
      '<div class="shead"><div><div class="sttl">Save: ' + esc(selLabel) + '</div>' +
        '<div class="ssub">Lead ' + esc(ID) + '</div></div>' +
        '<button type="button" class="sclose" aria-label="Close">&#10005;</button></div>' +
      '<div class="sbody">' + camposDeStatus() +
        '<label>Notes <span class="opt">optional</span></label>' +
        '<textarea id="notes" placeholder="Anything worth noting"></textarea>' +
        '<p id="err" class="errline"></p>' +
        '<button type="button" class="cbtn" id="confirm-save">Confirm &amp; save</button>' +
      '</div>';
    document.body.appendChild(ov); document.body.appendChild(sh);
    ov.addEventListener('click', cerrarConfirm);
    sh.querySelector('.sclose').addEventListener('click', cerrarConfirm);
    confirmAbierto = {ov: ov, sh: sh};
    requestAnimationFrame(function(){ ov.classList.add('on'); sh.classList.add('on'); });
    // Prellenados (mismos de siempre) + termino
    if (sel === 'sold') {
      if (j.premium) document.getElementById('sold_premium').value = j.premium;
      if (j.agent_comm) document.getElementById('sold_comm').value = j.agent_comm;
      if (j.fee) document.getElementById('sold_fee').value = j.fee; // v6.28
      var termBtns = sh.querySelectorAll('.term-btn');
      termBtns.forEach(function(tb){
        tb.classList.toggle('sel', parseInt(tb.getAttribute('data-term'), 10) === termSel);
        tb.onclick = function(ev){
          ev.stopPropagation();
          termSel = parseInt(tb.getAttribute('data-term'), 10);
          termBtns.forEach(function(x){ x.classList.remove('sel'); });
          tb.classList.add('sel');
        };
      });
    }
    if (sel === 'quoted' && j.premium) document.getElementById('quoted_premium').value = j.premium;
    document.getElementById('confirm-save').onclick = enviarGuardado;
  }
  function enviarGuardado(){
    var err = document.getElementById('err');
    var cb = document.getElementById('confirm-save');
    err.textContent = '';
    function fallo(msg){ err.textContent = msg; cb.disabled = false; cb.innerHTML = 'Confirm &amp; save'; }
    var params = {api:'save', id:ID, t:T, s:sel, notes:document.getElementById('notes').value};
    if (sel === 'sold') {
      var sp = parseFloat(document.getElementById('sold_premium').value);
      var scRaw = document.getElementById('sold_comm').value;
      var sc = scRaw ? parseFloat(scRaw) : null;
      if (!(sp > 0)) { fallo('Policy premium is required (greater than 0).'); return; }
      if (sc !== null && !(sc > 0 && sc <= 100)) { fallo('Agent commission must be a percentage between 0 and 100, or leave it empty.'); return; }
      var sfRaw = document.getElementById('sold_fee').value;
      var sf = sfRaw ? parseFloat(sfRaw) : null;
      if (sf !== null && !(sf >= 0)) { fallo('Extra fee must be 0 or greater, or leave it empty.'); return; }
      params.sold_premium = sp;
      if (sc !== null) params.sold_comm = sc;
      if (sf !== null) params.sold_fee = sf; // v6.28: contrato re-congelado (autorizado)
      params.sold_term = termSel;
    }
    if (sel === 'quoted') params.quoted_premium = document.getElementById('quoted_premium').value;
    if (sel === 'declined') params.reason = document.getElementById('reason').value;

    cb.disabled = true; cb.textContent = 'Saving...';
    var url = API + '?' + Object.keys(params).map(function(k){
      return k + '=' + encodeURIComponent(params[k] == null ? '' : params[k]); }).join('&');
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) { fallo(d.error || 'Could not save. Try again.'); return; }
        cerrarConfirm();
        pantallaExito(d);
      })
      .catch(function(){ fallo('Connection error. Your changes were not saved — try again.'); });
  }
  document.getElementById('save').onclick = function(){
    if (!sel) return;
    abrirConfirmSave();
  };
}

arrancar();
</script>
